name: aegis_tail_band
schema_version: 10
output_dir: runs/aegis/tail_band

# H1 KEEP, locked 2026-07-04 on the B2' cell (band 0.01/0.015, best = hedge_weight 0.05):
# fee drag 6.3%/yr -> ~0.1%/yr vs the daily control, crash capture ~120% of control,
# residual -1.05%/split ~= w x the structural -23%/yr roll bleed (H2/H3's target).
# See runs/aegis/2026-07-04 and [[monetizing-the-tail-sleeve]] (H1 checked).
lock: 20260704T174903854810Z_aegis_tail_band

# H1 of [[monetizing-the-tail-sleeve]]: the ALLOCATOR's tail-vs-core drift band, layer 1 only.
# Replace the tail sleeve's daily-rebalanced fixed weight with a banded sub-1.0 target weight
# (aegis.tailOverlay: LVO at hedge_weight, remainder CASH) and measure what the band alone buys:
# fee drag down without giving up crash-day capture. No harvest multiple (H2), no carry throttle
# (H3), no carry funding (H4) — those stack on this base only if it survives.
#
# EXECUTION MODEL: strategy axis (hedge_weight) sweeps IN-GRID; the band pair is a PORTFOLIO
# knob, so it is LOOP-EDITED across launches (the destsweep pattern), one run per band cell,
# control first. Pre-registered band cells, in launch order:
#   B0 (control):   band_up 0.00 / band_down 0.00  — daily constant-mix; the P2-style static
#                   overlay execution. Expect ~251 trades/split, fee drag ~6%/yr at w=0.05
#                   (the tail_vool cost note, now on a weight that drifts).
#   B1 (symmetric): band_up 0.01 / band_down 0.01
#   B2 (asym):      band_up 0.01 / band_down 0.05  — harvest fast / re-fund slow (One River's
#                   re-up rule as band asymmetry; the article's recommended shape).
#   B3 (wide asym): band_up 0.025 / band_down 0.10
# Band units are WEIGHT POINTS against a 0.02-0.05 target: calm daily LVO moves (~3-4%) drift
# the weight ~0.1-0.2pp — inside every non-zero band, so calm-year fills collapse; a March-2020
# spike (LVO ~x3-4) lifts w=0.05 by ~8-10pp — through every trim side, so the spike still
# harvests. Fee-floor note: a breach trade is ~band x NAV (0.01 x 5k = 50 EUR -> the 1.25 EUR
# floor is 2.5% of the trade), so the band cannot be narrower than B1 without re-creating the
# fill-storm destsweep killed; band_destination_fraction stays pinned 1.0 (trade-to-target is
# the fixed-fee optimum, destsweep 2026-07-03).
#
# PRE-REGISTERED KEEP/KILL (copy into the aegis run diary before launching B0):
#   keep: some banded cell (B1-B3) cuts the tail leg's fee drag to <= 2%/yr (vs ~6%/yr at B0)
#         AND retains >= 80% of B0's held-out crash-day capture at the same hedge_weight
#         AND does not worsen held-out total return vs B0 (the band may not deepen the bleed).
#   kill: every banded cell loses > 20% of crash-day capture, or none halves the fee drag.
#   Expectation on record: the band fixes EXECUTION cost only; the ~-23%/yr roll bleed is
#   structural (Bernstein's caveat) and stays until H2/H3. Judged at book level per the
#   article's validation section — never on sleeve-standalone Sharpe.
#
# Nested control at hedge_weight 1.0 is NOT in-grid here (gross 1.0 never drifts, bands inert);
# the component-level parity check vs aegis.heldHedge was verified pre-launch (byte-identical
# at hedge_weight 1.0; components carry no unit tests by repo convention).
# Window/splits/fees mirror tail.yaml exactly so B0 reads against the fresh
# 20260704T143038842848Z lock (crash-day +2.60% held-out, bleed -22.9%/split, 251 trades).
data:
  base_currency: EUR
  instruments: [LVO.XAMS]  # Amundi S&P 500 VIX Futures Enhanced Roll UCITS (conId 118017908),
  # primary-listed Euronext Amsterdam — the corrected identity (MIC XAMS -> IB AEB), see
  # tail.yaml 2026-07-04. The wrapper already times its own roll (mid-term default,
  # short-term when VIX > 1.35x 15d MA) — the band deliberately adds NO spike detector on top.
  arrays: [OHLCV]
  start: '2013-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: aegis.tailOverlay   # hedge_weight swept {0.02, 0.05} via param_space (P2's static 5%
                          # is the cell the drag numbers came from); n_benchmark 0

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003  # 0.03% IBKR auto-conversion, charged per trade on non-EUR legs
  fixed_fee: 1.25  # EUR per order (IBKR-IE retail, ~EUR 5k book) — the fee floor the band exists to beat
  band_up: 0.01    # LOOP-EDITED per run: B0 0/0 control, B1 0.01/0.01 (KEEP), B2' 0.01/0.015;
  band_down: 0.015 # B2 0.01/0.05 + B3 0.025/0.10 DEGENERATE (band_down >= w0 never opens - see diary)
  band_destination_fraction: 1.0  # pinned: trade-to-target is the fixed-fee optimum (destsweep)

# Rank by the tail mandate, same metric as tail_vool: mean book return on SPY's worst-decile
# days (lazy benchmark, no SPY column held). Within a band cell this separates the two
# hedge_weight cells; ACROSS band cells the pre-registered keep/kill above is the judge —
# crash capture retention and fee drag are read from the run stats, not re-ranked.
ranking:
  metric: crash_day_return

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
