name: aegis_tail_haven_basket
schema_version: 8
output_dir: runs/aegis/tail_haven_basket

# REVIVED Regime-B physical haven anchor (the roster's Target tier, physical branch). The
# 2026-06-14 aegis diary planned this as ucits_aegis_v2_physical_anchor (EURCHF + SGLN, fixed
# weights) then DROPPED it under the Regime-A-only ruling (a UCITS VIX-futures ETF, VOOL, reaches a
# genuine immediate-gamma tail, so the weaker physical "anchor, not tail" was judged unnecessary).
# Revived here as a STANDALONE characterization (parallel to tail_vool.yaml) because the roster's
# "Target earns its bleed" question is still OPEN and the live commingled book showed VOOL's
# budgeted ~1% coverage did not protect 2020 — so the cheaper-bleed physical anchor is worth
# measuring on its own stream. The A/B-vs-VOOL bake-off still waits on the allocator; this run only
# profiles the anchor's spike-versus-bleed, exactly as tail_vool profiled VOOL.
#
# The book is a fixed-weight, inverse-vol-balanced, continuously-rebalanced hold of two physical
# havens whose failure regimes do not coincide (the-ucits-constrained-tail-sleeve.md, Regime B):
#   - 4GLD.DE   Xetra-Gold (EUR, Deutsche Boerse) — Europe's largest physical gold ETC, 0% TER,
#     EUR-native (its EUR price already embeds the USD/EUR move a euro investor experiences). Chosen
#     over the iShares ETC's SGLN.L line, which yfinance returns in GBp with ~65% (corrupted,
#     pence/pound-scaled) vol; 4GLD.DE is clean (~14% vol).
#   - CSBGC3.SW iShares Swiss Domestic Government Bond (CHF, SIX) — the holdable CHF leg: a short
#     Swiss-government UCITS whose CHF carry is small/negative and whose EUR-converted return is
#     FX-dominated, so "the FX is the convex part" (the-ucits-constrained-tail-sleeve.md, l.64) and
#     "long the asset = long CHF" is unambiguous. Clean ~2.5% CHF-denominated vol; CSBGC0 (1-3y) was
#     rejected — its yfinance line is noisy (~6.9% vol).
# aegis.heldHedge holds a fixed inverse-vol SHAPE over the two legs at gross 1.0 (the lower-vol CHF
# leg takes the larger share); the continuous rebalance sells whichever haven spikes. It is NOT
# vol-targeted — a tail/anchor must be present precisely when its own vol spikes. Ranked by
# crash_day_return (mean basket return on SPY's worst-decile days): the same anti-equity convexity
# axis as tail_vool, so the two are directly comparable when the allocator runs the bake-off. SPY is
# pulled lazily by the metric and is NOT a held leg. Window 2010-01..2025-01 (the CHF leg ~2009-07
# and gold ~2009-11 inceptions bind the start); covers the 2015 CHF unpeg, Feb/Q4-2018, COVID-2020,
# 2022. No `lock` yet — it is added after the first sweep pins a winner for execution-bundle export.
# Inferred from research/vault/research/the-ucits-constrained-tail-sleeve.md (Regime B) and
# research/vault/runs/aegis/2026-06-14.md (revives the dropped v2 physical anchor).
data:
  source: yf
  arrays:
  - OHLCV
  # ccy = the line's native yfinance quote currency; prices are converted to
  # portfolio.base_currency (EUR) before indicators/portfolio.
  # mic = ISO 10383 venue (provider-agnostic), used only by aerd export to
  # resolve the ticker to one FIGI; the research runtime ignores it.
  symbols:
  - {ticker: 4GLD.DE, ccy: EUR, mic: XETR}     # gold haven, EUR-native (Xetra-Gold)
  - {ticker: CSBGC3.SW, ccy: CHF, mic: XSWX}   # Swiss-franc haven, CHF -> EUR (FX is the convex part)
  start: '2010-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: aegis.heldHedge

portfolio:
  gross_cap: 1.0
  direction: longonly
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003  # 0.03% IBKR auto-conversion, charged per trade on the non-EUR (CHF) leg

# A defensive anchor is judged on the same anti-equity convexity axis as the VOOL tail: rank by
# crash_day_return — the mean basket return on the benchmark's (SPY) worst-decile days. The metric
# lazy-pulls SPY and aligns it to the basket's own calendar, so it needs no SPY column and triggers
# no cross-venue warning, while keeping the anti-equity TIMING evidence comparable to tail_vool.
ranking:
  metric: crash_day_return

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    # 15 (not the family's 10): the deeper haven history (2010-) yields ~13 rolling
    # folds vs VOOL's 2013-start ~10. The cap only bounds compute; using all folds
    # adds held-out evidence (incl. the 2011 EU crisis + Sep-2011 SNB CHF peg).
    max_splits: 15
