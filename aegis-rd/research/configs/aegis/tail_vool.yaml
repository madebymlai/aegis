name: aegis_tail_vool
schema_version: 8
output_dir: runs/aegis/tail_vool

# Pinned winner of the latest sweep (role: best) for execution-bundle export.
lock: 20260615T034350426192Z_aegis_tail_vool

# STANDALONE Regime-A tail sleeve (the roster's target tier), built and scored on its own —
# the overlay onto the atalanta floor is the future allocator's job, not this strategy's.
# The book is a fixed-weight, continuously-rebalanced 100% hold of VOOL (Lyxor/Amundi S&P 500
# VIX Futures Enhanced Roll UCITS ETF, EUR, Xetra) — the UCITS VIXY. This run characterizes the
# sleeve's spike-versus-bleed PROFILE directly on our harness: the crisis-window capture vs the
# calm-year drainage, scored by its anti-equity convexity signature.
#
# SINGLE-VENUE, LAZY BENCHMARK: VOOL.DE is the only symbol, so the book is 100% VOOL held on its
# own full Xetra calendar — no benchmark leg to carry (n_benchmark defaults to 0) and no
# cross-venue intersection to realign (hence no calendar-drop warning to silence). The sleeve is
# ranked by crash-day return — the mean VOOL return on SPY's worst-decile days — which keeps the
# anti-equity TIMING evidence a tail lives on. SPY is NOT held and NOT in the panel: the
# convexity metric pulls it lazily over VOOL's span and aligns it to VOOL's own dates
# (EquityCurve.aligned_benchmark_returns), so the benchmark reference costs nothing in the book
# and forces no cross-venue calendar. (Down-capture in capture.py, by contrast, reads SPY from
# the close panel and WOULD need it held-then-excluded — which is why we rank by a convexity-axis
# metric here.) Window 2013-01..2025-01: VOOL inception (2013-01) binds the start; covers
# Feb-2018 / Q4-2018 / Mar-2020 / 2022.
# Inferred from research/vault/research/the-ucits-constrained-tail-sleeve.md (Regime A, h1).
data:
  source: yf
  arrays:
  - OHLCV
  # ccy = the line's native yfinance quote currency; prices are converted to
  # portfolio.base_currency (EUR) before indicators/portfolio.
  symbols:
  - {ticker: VOOL.DE, ccy: EUR}   # the tail leg, native EUR, held 100%
  start: '2013-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: aegis.heldHedge

portfolio:
  gross_cap: 1.0
  direction: longonly
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003  # 0.03% IBKR auto-conversion, charged per trade on non-EUR legs

# A tail sleeve is judged by crash-time gain: rank by crash-day return — the mean sleeve return
# on the benchmark's (SPY) worst-decile days. The metric lazy-pulls SPY and aligns it to VOOL's
# own calendar, so this benchmark-relative score needs no SPY column and triggers no cross-venue
# warning, while keeping the anti-equity TIMING evidence a tail must prove.
ranking:
  metric: crash_day_return

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
