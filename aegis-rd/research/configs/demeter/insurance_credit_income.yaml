name: demeter_insurance_credit_income
schema_version: 10
output_dir: runs/demeter_eu/insurance_credit_income

# Static convergent-income policy. CBUS5E and STEA sell corporate default and
# liquidity risk through EUR-hedged wrappers; CATB sells catastrophe-insurance
# risk. CATB.LSEETF is the qualified USD London line of IE000UWJUW87 and is the
# only line that currently passes quote, distribution, and extension paths.
# The 20% allocation is an operational cap, not a fitted richness signal. The
# parent allocator owns Demeter's total book weight.
data:
  base_currency: EUR
  instruments: [CBUS5E.XBRU:QUOTE, STEA.LSEETF, CATB.LSEETF:QUOTE]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2026-01-13'
  end: '2026-07-11'
  timeframe: 1D
  missing_index: drop

indicators:
- id: demeter.concave_payer_policy

strategy:
  id: demeter.insurance_credit_income

portfolio:
  gross_cap: 1.0
  net_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 3.75
  band_up: 0.02
  band_down: 0.04

ranking:
  metric: convergent_income_utility

report:
  metrics: [convergent_tail_budget, convergent_downside_lskew]

optimization:
  search: grid
  seed: 42
  split:
    method: from_n_rolling
    params:
      n: 3
      length: 84
      split: 0.5
    max_splits: 3
