name: demeter_eu_credit_carry_sharpe
schema_version: 10
output_dir: runs/demeter_eu/credit_carry_sharpe

# THE RANKER A/B, control arm — identical book, grid, seed and splits as carry_income.yaml;
# the ONE difference is the ranking metric: sharpe_ratio (the incumbent objective under
# test) vs carry_income_utility there. This arm exists so the comparison is
# champion-vs-champion under the engine's own selection on the same 54-cell sweep, not a
# post-hoc re-ranking. See carry_income.yaml's header for the argument and
# research/vault/runs/demeter/2026-07-03.md for the pre-registered criteria.
data:
  base_currency: EUR
  instruments: [IHYU.LSEETF, LQDH.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: demeter_eu.credit_carry   # carry_window swept via param_space {126, 252, 504}
- id: demeter.realized_vol      # vol_window swept via param_space {21, 63}

strategy:
  id: demeter.carry             # vol_target {0.06,0.10,0.15} x carry_gain {0,1,2} via param_space

portfolio:
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003  # 0.03% IBKR auto-conversion, charged per trade on non-EUR legs

ranking:
  metric: sharpe_ratio

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
