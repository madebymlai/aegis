name: demeter_eu_credit_carry_income
schema_version: 10
output_dir: runs/demeter_eu/credit_carry_income

# THE RANKER A/B, income arm — identical book, grid, seed and splits as carry_sharpe.yaml
# (the control arm); the ONE difference between the two configs is the ranking metric:
# carry_income_utility (MPPM, rho=3) here vs sharpe_ratio there. Sharpe is the objective a
# short-gamma sleeve games by construction (the Sharpe-maximizing payoff IS "regular modest
# profits punctuated by occasional crashes" — Goetzmann-Ingersoll-Spiegel-Welch), so a
# sharpe-ranked sweep may select the cell that best hides its tail rather than the best
# income engine. The MPPM is the manipulation-proof mirror of atalanta's
# trend_convexity_payoff: it ranks certainty-equivalent income net of the hidden tail, from
# the same daily net stream, no threshold/horizon knob (rho in metric metadata; rho-stability
# is a post-hoc trust check via carry_utility_rho_sensitivity_from_curve).
#
# The full grid is swept (no pinned params): carry_window {126,252,504} x vol_window {21,63}
# x vol_target {0.06,0.10,0.15} x carry_gain {0,1,2} = 54 cells — windows and gains are
# exactly where tail-hiding can live, so the rankers get the whole space to disagree over.
#
# Article: research/vault/research/what-makes-a-carry-sleeve-an-income-engine.md
# Pre-registered criteria: research/vault/runs/demeter/2026-07-03.md (the ranker A/B).
data:
  base_currency: EUR
  instruments: [IHYU.LSEETF, LQDH.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: demeter_eu.credit_carry   # carry_window swept via param_space {126, 252, 504}
- id: demeter.realized_vol      # vol_window swept via param_space {21, 63}

strategy:
  id: demeter.carry             # vol_target {0.06,0.10,0.15} x carry_gain {0,1,2} via param_space

portfolio:
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003  # 0.03% IBKR auto-conversion, charged per trade on non-EUR legs

ranking:
  metric: carry_income_utility

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
