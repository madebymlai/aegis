name: demeter_static_short_credit_unhedged_control
schema_version: 11
output_dir: runs/demeter_eu/static_short_credit_unhedged

# Matched short-duration control. The native USD prices are translated into the
# same EUR-base book, keeping target weights, dates and execution policy identical.
data:
  base_currency: EUR
  instruments: [SDIG.LSEETF, SDHY.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2020-08-10'
  end: '2026-07-01'
  timeframe: 1D
  missing_index: drop

indicators: []

strategy:
  id: demeter.static_short_credit

portfolio:
  direction: longonly
  init_cash: 5000.0
  fees: 0.0
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  # Match the hedged baseline's conservative commission assumption exactly.
  fixed_fee: 3.75
  band_up: 0.02
  band_down: 0.04

ranking:
  metric: convergent_income_utility

report:
  metrics: [convergent_tail_budget, convergent_downside_lskew]

optimization:
  search: grid
  seed: 42
  split:
    method: from_n_expanding
    params:
      n: 4
      min_length: 756
      split: -252
    max_splits: 10
