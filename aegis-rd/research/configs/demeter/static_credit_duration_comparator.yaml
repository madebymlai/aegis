name: demeter_static_credit_duration_comparator
schema_version: 11
output_dir: runs/demeter_eu/static_credit_duration_comparator

# Parameter-free EUR-base research comparator. It adds broad-duration IG and HY
# exposures to the short-duration baseline without introducing a duration signal.
data:
  base_currency: EUR
  instruments: [CBUS5E.XBRU:QUOTE, LQEE.LSEETF, STEA.LSEETF, IHYE.LSEETF]
  arrays: [OHLCV]
  start: '2020-08-10'
  end: '2026-07-01'
  timeframe: 1D
  missing_index: drop

indicators: []

strategy:
  id: demeter.static_short_credit

portfolio:
  direction: longonly
  init_cash: 5000.0
  fees: 0.0
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  # Conservative scalar covering the observed EUR 3.00 London and
  # EUR 3.00-3.75 CBUS5E one-share commissions.
  fixed_fee: 3.75
  band_up: 0.02
  band_down: 0.04

ranking:
  metric: convergent_income_utility

report:
  metrics: [convergent_tail_budget, convergent_downside_lskew, total_fees_paid, total_trades]

optimization:
  search: grid
  seed: 42
  observation_block_bars: 252
