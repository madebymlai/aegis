name: atalanta_trend_barbell_blend
schema_version: 10
output_dir: runs/atalanta/trend-barbell-blend

# ════════════════════════════════════════════════════════════════════════════════════════════════
# ATALANTA BARBELL-BLEND CHALLENGER (GH #80, [[runs/atalanta/2026-07-09#barbell_blend]]).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# The CORRECT re-test of the fast/short-horizon lever, after two flawed prior attempts:
#   - the archived long-only barbell AVERAGED two weight books (0.5*(w_fast+w_slow)) = the concave
#     rebalancing-premium trap, on the aegis 10-ETF book (killed 2026-06-10);
#   - the turngate gated the OLD pre-short-cap champion (conv 0.424), never today's 0.447 shortmute.
# This blends at the SIGNAL level (atalanta.trend_score_blend: one score = (1-w)*slope189 +
# w*slope30_rescaled), fed to the UNCHANGED champion keystone_shortmute. One book, no concave
# rebalancing; the fast slope is rescaled to the slow slope's trailing vol so the champion's
# bands (0.10/0.05) and short_cap (0.10) stay calibrated. blend_w=0 is the nested control and MUST
# reproduce the locked champion trend_convexity_payoff 0.447 bit-for-bit.
#
# PRE-REGISTERED keep/kill (held-out, ranked on trend_convexity_payoff; Sharpe reported not ranked):
#   KEEP if some interior blend_w clears ALL three: (1) trend_convexity_payoff >= 0.447 - CI (does
#   NOT dilute the convex pole - the bar the turngate failed monotonically); (2) worst-split maxDD
#   <= champion - 1pp (the drawdown ask); (3) worst calm year >= -6% (concavity-landmine guardrail).
#   KILL if convexity falls monotonically in blend_w with no bulge (the fast leg dilutes here too -
#   the broad-futures speed result does not transfer to a thin 3-name book), OR the calm-year floor
#   breaks (residual rebalancing concavity), OR only drawdown improves at a convexity cost (a
#   drawdown lever, not the convex pole - the turngate outcome reproduced).
#
# Identical universe / window / splits / portfolio to the champion (trend_floor.yaml); ONLY the
# trend_score indicator changes. USD legs convert to EUR via EUR/USD (gateway up for the cold fetch).
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_blend   # blend_w swept {0,0.15,0.30,0.50}; horizons/scale pinned here
    params:
      slow_lookback: 189
      fast_lookback: 30
      scale_window: 252
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute    # UNCHANGED champion; params pinned to the locked cell
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 2.0
  net_cap: 2.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
