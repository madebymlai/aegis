# SUBSTITUTED full L/S (aegis-rd-167): restore the high-value un-borrowable axes with
# borrowable-UCITS substitutes so the full-20-axis L/S is actually tradable. Swaps (2026-06-17
# IBKR probe):
#   AIGC -> CMOD.L (broad commodity, 157k borrow), IGLO -> SGLO.L (global govt, 239k),
#   SSLV -> ISLN.L (silver, 29k),                  GILI -> INXG.L (UK linkers, 8.7k).
# The other 6 un-borrowable axes (AIGA ags, WEAT wheat, HEAT heating, COCO cocoa, NGAS natgas,
# GBUS dollar) have NO borrowable UCITS and stay long-only (shortmask borrowable policy). So this
# book shorts 14 axes (10 original borrowable + 4 substitutes), long-only the other 6 -- the
# tradable approximation of the full-20 L/S, vs borrowable-L/S (10-short, Sharpe 0.82 book) and
# long-only (0.68). FORGO gross; direction both.
