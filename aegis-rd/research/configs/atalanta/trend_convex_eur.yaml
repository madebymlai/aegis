name: atalanta_trend_convex_eur
schema_version: 10
output_dir: runs/atalanta/trend_convex_eur

# THE RESEARCHED "BEST SHAPE", live-research-parity safe (~EUR 5k retail, Italy/IBKR-IE).
# Distilled from docs/research/trend-sleeve-small-account-research.md + trend-component-design-fixed-fee.md
# and [[trend-following-under-a-fixed-per-order-fee]]. Two findings drive every choice here:
#   1. Under a FIXED per-order fee only the COUNT of fills matters, so "trade rarely" is the
#      dominant lever - but it must be expressed so research and live agree.
#   2. The live path (aegis-trader rebalancer) holds via a realized-space DRIFT BAND on finite
#      target weights; it never sees per-bar NaN. So "hold" is NOT a NaN gate (research-only) -
#      it is FORGO finite targets + a drift band. Here the band is portfolio.rebalance_band,
#      enforced in the research sim as vbt min_size (verified: holds drift, trades past the band),
#      which mirrors the live BookConfig.default_band_up/down. Same drift gate, same trades.
#
# UNIVERSE - the minimal set spanning the orthogonal macro crisis engines (not max breadth: each
# added cash-ETF name costs fills, and widening was net-negative). Four independent bets, all
# verified live on the paper gateway and warm in the catalog:
#   VWRD.LSEETF  global equity            107968716  Vanguard FTSE All-World UCITS USD Dist
#   IDTL.LSEETF  long-duration US rates   181150836  iShares $ Treasury 20+yr   (deflation-crisis engine)
#   IGLN.LSEETF  gold                     86656182   iShares Physical Gold ETC
#   ICOM.LSEETF  broad commodities        282849246  iShares Diversified Commodity (inflation-crisis engine)
data:
  base_currency: EUR
  instruments: [VWRD.LSEETF, IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  # All four legs are USD-quoted; declare the FX pair so the data layer converts them to the
  # EUR base (exchange-only id, not tradeable). IDEALPRO is IBKR's FX venue.
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  # Smoother SLOW estimator: annualized OLS slope of log price (every bar in the window), not the
  # endpoint ratio. Fewer sign flips near zero -> fewer state changes -> fewer fills, with the
  # convexity preserved at the quarterly horizon. Sweeps the slow band only (lookback 126/189/252).
  - id: atalanta.trend_score_regress
  # Inverse-vol sizing with a LONG vol window pinned: a long vol window paired with a long lookback
  # preserves positive skew (Research Affiliates); a short window "all but negates" it. Pinned (not
  # swept) so the skew-preserving choice is baked, not left to the ranker.
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  # FORGO long-only (cash-when-flat): the parity-correct finite expression of "flat" (weight 0 /
  # reduced gross), read identically by vbt and the live rebalancer. The in-strategy buffer is
  # PINNED OFF (buffer_band 0): turnover is owned by the portfolio drift band, not a per-bar buffer
  # (which the live path ignores and vbt drift-corrects through). entry_band stays swept.
  id: atalanta.trendStraddleBufferedLongOnly
  params:
    buffer_band: 0.0

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  # IBKR EUR Tiered per-order MINIMUM, charged per fill. At EUR 5k this fixed cost dominates,
  # so the whole design is about cutting the fill COUNT.
  fixed_fee: 1.25
  # THE turnover lever (live-research parity): per-name drift band as a fraction of NAV. A position
  # is held through drift and only rebalanced to target once it drifts past 5% - mirrors the live
  # rebalancer's symmetric per-instrument band (default 2%; widened here to cut fills at EUR 5k).
  # A slow signal keeps the target stable, so target ~ realized stays inside the band and the book
  # holds for free - no NaN, no calendar cadence. Enforced as vbt min_size under targetpercent.
  rebalance_band: 0.05

ranking:
  # Rank on the convex shape, never Sharpe/Calmar/UPI (they select the LEAST-convex book).
  # Benchmark-free, magnitude-aware, quarterly-horizon ([[what-makes-a-trend-sleeve-convex]]).
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
