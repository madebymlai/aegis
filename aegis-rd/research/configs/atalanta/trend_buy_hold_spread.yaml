name: atalanta_trend_buy_hold_spread
schema_version: 10
output_dir: runs/atalanta/trend-buy-hold-spread

# Buy-hold-spread experiment derived from atalanta/trend.yaml:
# keep the definitive EUR non-equity Atalanta sleeve, but sweep the portfolio
# drift-band asymmetry. Semantics: band_down gates adds, band_up gates trims.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  rebalance_band: 0.15

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  portfolio:
    band_up: [0.05, 0.10]
    band_down: [0.15, 0.20, 0.25]
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
