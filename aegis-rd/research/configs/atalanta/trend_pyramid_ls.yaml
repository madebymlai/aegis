name: atalanta_trend_pyramid_ls
schema_version: 8
output_dir: runs/atalanta/trend_pyramid_ls

# PYRAMIDING on the usual London ETF/ETC book, FULL L/S in backtest (yfinance =F futures are broken;
# the .L ETF data is clean, and we allow shorting in the backtest regardless of real borrowability).
# Tests [[what-makes-a-trend-sleeve-convex]] hypothesis #2 with atalanta.trendStraddleBufferedPyramid:
# each name builds 0->full over `ramp_steps` bars of trend persistence, so gross floats up as trends
# mature (convex - builds the right tail) and down in chop. Same 20-name universe + champion signal
# params (trend_score lb252 + realized_vol vw63) as trend.yaml, so the only changes vs the live champion
# are: strategy (pyramid vs buffered), direction (both vs longonly), ranking (skew vs UPI). ramp_steps 1
# == the buffered champion exactly (no-pyramid baseline) vs 21/63/126, with/without the 0.20 buffer.
# Ranked by quarterly_return_skew (the shape pyramiding should deepen); sharpe + UPI emitted for the
# held-out gate. CAVEAT: per-split window ~1y (~4 quarters) -> per-split skew is noisy; the authoritative
# skew read is full-sample (post-hoc), the held-out skew gate is directional.
data:
  source: yf
  arrays:
  - OHLCV
  symbols:
  - {ticker: IDTL.L, ccy: USD, mic: XLON}
  - {ticker: ITPS.L, ccy: GBP, mic: XLON}
  - {ticker: SEGA.L, ccy: GBP, mic: XLON}
  - {ticker: AIGC.L, ccy: USD, mic: XLON, figi: BBG000BLDWV1}
  - {ticker: IGLN.L, ccy: USD, mic: XLON, figi: BBG001M8D7W0}
  - {ticker: BRNT.L, ccy: USD, mic: XLON}
  - {ticker: COPA.L, ccy: USD, mic: XLON, figi: BBG000BL3W79}
  - {ticker: AIGA.L, ccy: USD, mic: XLON, figi: BBG000BLFVZ7}
  - {ticker: GBUS.L, ccy: GBp, mic: XLON, figi: BBG000R20GS9}
  - {ticker: EMCP.L, ccy: GBP, mic: XLON}
  - {ticker: HYLD.L, ccy: USD, mic: XLON}
  - {ticker: SSLV.L, ccy: USD, mic: XLON}
  - {ticker: IEGE.L, ccy: EUR, mic: XLON, isin: IE00B3FH7618}
  - {ticker: GILI.L, ccy: GBp, mic: XLON}
  - {ticker: WEAT.L, ccy: USD, mic: XLON, figi: BBG000BLCP10}
  - {ticker: HEAT.L, ccy: USD, mic: XLON, figi: BBG000BLBMN4}
  - {ticker: CORN.L, ccy: USD, mic: XLON}
  - {ticker: NGAS.L, ccy: USD, mic: XLON, figi: BBG000BLC3X4}
  - {ticker: IGLO.L, ccy: USD, mic: XLON}
  - {ticker: IBTA.L, ccy: USD, mic: XLON}
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.trend_score
  params:
    lookback: 252
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: atalanta.trendStraddleBufferedPyramid

portfolio:
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003

ranking:
  metric: quarterly_return_skew

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
