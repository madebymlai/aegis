name: atalanta_trend_speedsweep
schema_version: 10
output_dir: runs/atalanta/trend-speedsweep

# ════════════════════════════════════════════════════════════════════════════════════════════════
# SPEED SWEEP - decay-insulation test ([[is-the-trend-premium-decaying]] h53).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# Controlled clone of the LIVE sleeve (trend.yaml): everything held constant - same non-equity EUR
# universe, vol_window 126, keystone_shortmute short_cap 0.10, asymmetric drift band, from_rolling
# 504/0.5, ranked trend_convexity_payoff - and ONLY trend_score_regress.lookback is varied across the
# fast / medium / slow bands. The regression slope is annualized (exp(slope*252)-1), so the fixed
# enter_band 0.10 (= 10%/yr) is scale-comparable at every speed. Per-split held-out sharpe_ratio is
# read pre-2022 vs post-2022 to test whether the slow band (live lb189) is decay-insulated while
# fast/medium degrade post-2022. Run A = {21, 63, 189}; run B edits the lookback list to {42,126,252}.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 252   # SWEEP-SCALAR (loop-edited over 21/42/63/126/189/252; config rejects a list)
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
