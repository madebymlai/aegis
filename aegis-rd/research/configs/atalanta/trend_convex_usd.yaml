name: atalanta_trend_convex_usd
schema_version: 10
output_dir: runs/atalanta/trend_convex_usd

# USD-BASE VALIDATION of the researched "best shape" + the live-research-parity drift band.
# Same universe/signal/band as trend_convex_eur.yaml, but base_currency USD so the four USD-quoted
# legs need no FX pair (the EUR run is blocked by a data-layer FX-fetch bug: cash FX is requested
# with whatToShow=TRADES/LAST, but IDEALPRO FX only serves MIDPOINT/MID). This isolates and proves
# the new components and the rebalance_band turnover mechanism without the IB FX dependency; the
# turnover/convexity conclusions are currency-agnostic. EUR remains the real deliverable.
data:
  base_currency: USD
  instruments: [VWRD.LSEETF, IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.trendStraddleBufferedLongOnly
  params:
    buffer_band: 0.0

portfolio:
  base_currency: USD
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0
  fixed_fee: 1.25
  # The live-research-parity per-name drift band (vbt min_size under targetpercent).
  rebalance_band: 0.05

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
