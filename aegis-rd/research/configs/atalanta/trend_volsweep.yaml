name: atalanta_trend_volsweep
schema_version: 10
output_dir: runs/atalanta/trend-volsweep

# ════════════════════════════════════════════════════════════════════════════════════════════════
# RA VOL-WINDOW SWEEP on the live champion (atalanta trend.yaml). The deferred convexity knob.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# The one untested convexity lever from [[runs/atalanta/2026-06-29]] ## Next. The champion pins
# realized_vol `vol_window: 126`; [[what-makes-a-trend-sleeve-convex]] (Research Affiliates) says a
# SHORT vol window paired with a LONG trend lookback negates positive skew, so a LONGER vol window
# should PRESERVE/LIFT convexity. The 2026-06-29 speed sweep varied the TREND lookback (proved lb189
# is the convexity+Sharpe peak) but held `vol_window 126` constant throughout - so this is the
# orthogonal knob it never touched. Everything is pinned to the champion (keystone_shortmute
# short_cap 0.10, lb189, asymmetric drift band, EUR EUR5k); ONLY realized_vol.vol_window varies.
#
# Config rejects a list indicator param (2026-06-29 note), so swept by loop-editing `vol_window` over
# {126 (= champion control, known held-out conv 0.4474 / Sharpe 1.18 / meanDD 7.18), 252, 378}. Data
# warm (IDTL/IGLN/ICOM cached). No lock (a sweep). See [[runs/atalanta/2026-07-03]] for keep/kill.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 378          # SWEEP KNOB: loop-edit 252 -> 378 (126 is the champion control)

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
