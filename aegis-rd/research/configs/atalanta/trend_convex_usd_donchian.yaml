name: atalanta_trend_convex_usd_donchian
schema_version: 10
output_dir: runs/atalanta/trend_convex_usd_donchian

# ESTIMATOR A/B: the hysteretic Donchian-STATE signal vs the regression-slope score
# (trend_convex_usd.yaml). Everything else is identical - same four-name universe, same long vol
# pin (126), same live-research-parity drift band (0.05), same ranking and splits - so the only
# moving part is the trend estimator. Isolates whether an explicit dead-zone latch
# (atalanta.donchian_state) cuts fills and holds/raises convexity vs the smoother continuous slope.
# Report the triple per cell: trend_convexity_payoff AND fills/yr AND fees-as-%NAV.
data:
  base_currency: USD
  instruments: [VWRD.LSEETF, IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  # Sticky, hysteretic breakout latch: +1 above the prior entry_window high, -1 below the prior
  # exit_window low, prior state carried in the dead-zone. Sweeps entry_window x exit_window
  # (entry > exit always, so the gap is the dead-zone). Drop-in for trend_score (signed discrete).
  - id: atalanta.donchian_state
  # Long vol window pinned (skew-preserving), same as the regression-slope config.
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  # FORGO long-only, unchanged. entry_band and buffer_band are PINNED OFF: a discrete +/-1 state
  # makes the sign gate (entry_band < 1) a no-op, and turnover is owned by the portfolio drift
  # band, not a per-bar buffer. Pinning both keeps the sweep to the 3x3 Donchian window grid.
  id: atalanta.trendStraddleBufferedLongOnly
  params:
    entry_band: 0.0
    buffer_band: 0.0

portfolio:
  base_currency: USD
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0
  fixed_fee: 1.25
  # The live-research-parity per-name drift band (vbt min_size under targetpercent).
  rebalance_band: 0.05

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
