name: atalanta_trend_futures_pyramid
schema_version: 9
output_dir: runs/atalanta/trend_futures_pyramid

# PYRAMIDING test on the futures substrate ([[what-makes-a-trend-sleeve-convex]] hypothesis #2, the one
# article shape-lever the codebase lacked). Same GLBX book + champion signal params as
# trend_futures_ls.yaml (trend_score lb252 + realized_vol vw63, full L/S), but the strategy is
# atalanta.trendStraddleBufferedPyramid: each name builds 0->full over `ramp_steps` bars of trend
# persistence, so gross floats up as trends mature (convex, builds the right tail) and down in chop.
# Pinned signal params + a small strategy grid isolate the lever: ramp_steps 1 == the buffered champion
# exactly (no-pyramid baseline), vs 21/63/126; with/without the 0.20 buffer. Ranked by quarterly skew
# (the shape the pyramid is supposed to deepen); sharpe + UPI emitted alongside for the held-out gate.
#
# DATA: aegis historical store (source: store, provider: databento), dataset GLBX.MDP3. Futures are
# our ratio back-adjusted continuous (adjustment: backward_ratio) — dated outright legs rolled on real
# expiry, gap-free. Store gap-fills from Databento on first run and caches to parquet (pull-once); key
# read from $DATABENTO_API_KEY. The store coverage pull is per-root sequential on the first run (no
# engine knob — store is a local source); later runs read the cache.
data:
  source: store
  provider: databento
  dataset: GLBX.MDP3
  arrays:
  - OHLCV
  symbols:
  - {root: ZT, ccy: USD, adjustment: backward_ratio}
  - {root: ZF, ccy: USD, adjustment: backward_ratio}
  - {root: ZN, ccy: USD, adjustment: backward_ratio}
  - {root: ZB, ccy: USD, adjustment: backward_ratio}
  - {root: UB, ccy: USD, adjustment: backward_ratio}
  - {root: 6E, ccy: USD, adjustment: backward_ratio}
  - {root: 6J, ccy: USD, adjustment: backward_ratio}
  - {root: 6B, ccy: USD, adjustment: backward_ratio}
  - {root: 6A, ccy: USD, adjustment: backward_ratio}
  - {root: 6C, ccy: USD, adjustment: backward_ratio}
  - {root: 6S, ccy: USD, adjustment: backward_ratio}
  - {root: CL, ccy: USD, adjustment: backward_ratio}
  - {root: NG, ccy: USD, adjustment: backward_ratio}
  - {root: RB, ccy: USD, adjustment: backward_ratio}
  - {root: HO, ccy: USD, adjustment: backward_ratio}
  - {root: GC, ccy: USD, adjustment: backward_ratio}
  - {root: SI, ccy: USD, adjustment: backward_ratio}
  - {root: HG, ccy: USD, adjustment: backward_ratio}
  - {root: PL, ccy: USD, adjustment: backward_ratio}
  - {root: PA, ccy: USD, adjustment: backward_ratio}
  - {root: ZC, ccy: USD, adjustment: backward_ratio}
  - {root: ZW, ccy: USD, adjustment: backward_ratio}
  - {root: ZS, ccy: USD, adjustment: backward_ratio}
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.trend_score
  params:
    lookback: 252
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: atalanta.trendStraddleBufferedPyramid

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003

ranking:
  metric: quarterly_return_skew

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
