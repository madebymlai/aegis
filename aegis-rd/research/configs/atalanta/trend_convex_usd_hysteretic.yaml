name: atalanta_trend_convex_usd_hysteretic
schema_version: 10
output_dir: runs/atalanta/trend_convex_usd_hysteretic

# STRATEGY A/B: the magnitude-preserving hysteretic strategy vs the two prior shapes, all on the
# same four-name universe, long vol pin (126), live-research-parity drift band (0.05), ranking and
# splits. Only the SIGN gate changes:
#   trend_convex_usd.yaml          continuous regression slope, RAW sign        (champion shape)
#   trend_convex_usd_donchian.yaml binary Donchian breakout state (no magnitude) (cut fills, lost convexity)
#   THIS                           continuous slope, HYSTERETIC sign + magnitude (the hybrid)
# Hypothesis: the Schmitt-trigger sign cuts fills like the Donchian while the continuous magnitude
# holds convexity like the slope. Report the triple per cell: trend_convexity_payoff AND fills/yr
# AND fees-as-%NAV. Win = convexity >= champion AND fills/yr < champion.
data:
  base_currency: USD
  instruments: [VWRD.LSEETF, IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  # Continuous smoother slope - the magnitude source (sweeps the slow band 126/189/252).
  - id: atalanta.trend_score_regress
  # Long vol window pinned (skew-preserving), same as the other two configs.
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  # Hysteretic FORGO long-only: Schmitt-trigger sign latch (enter/exit dead-zone) over the
  # continuous slope magnitude. No per-bar buffer - holding is the portfolio drift band's job.
  id: atalanta.trendStraddleHystereticLongOnly

portfolio:
  base_currency: USD
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0
  fixed_fee: 1.25
  # The live-research-parity per-name drift band (vbt min_size under targetpercent).
  rebalance_band: 0.05

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
