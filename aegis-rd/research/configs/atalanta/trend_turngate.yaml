name: atalanta_trend_turngate
schema_version: 10
output_dir: runs/atalanta/trend-turngate

# ════════════════════════════════════════════════════════════════════════════════════════════════
# TURNING-POINT GATE test on the live champion (atalanta trend.yaml).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# Hypothesis ([[trend-following-in-whipsaw-regimes]], Harvey-Goulding-Mazzoleni "Breaking Bad Trends"
# FAJ 2023): the live walk-forward's worst out-of-sample split (-5.4% / Sharpe -0.53 / 20% win) is a
# turning-point / whipsaw window, not a crisis failure. A FAST trend read used as a GATE on the slow
# position (de-risk to cash when the fast slope has turned but the sticky slow latch has not) should
# cut that bleed WITHOUT the whipsaw a fast trading leg added (killed 2026-06-10). Fast as a
# modulator, never a position of its own.
#
# Nested test: gate_strength = 1.0 reproduces the champion EXACTLY (no gate), so any cell that beats
# it on held-out trend_convexity_payoff is a real lever, not a different config. Everything except the
# gate is pinned to trend.yaml: slow lb 189, vol_window 126, bands 0.10/0.05, EUR EUR5k, IDTL
# borrow-gated short, gross 1.0, same 6 rolling splits, ranked on trend_convexity_payoff.
#
# Grid (param_space-driven, no params block on the swept components):
#   indicator atalanta.trend_score_regress_dual : lookback [189] x fast_lookback [42, 63]
#   strategy  atalanta.keystone_turngate         : gate_strength [0.0, 0.5, 1.0]
#   => 6 candidates; the two gate_strength=1.0 cells are the champion control.
#
# No lock: this is an optimization sweep, not a single scored candidate. Data is warm from the
# 2026-06-29 trend.yaml run (EUR/USD FX + LSEETF bars cached), so no gateway needed to re-run.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress_dual   # slow trend_score lb189 (= champion) + fast trend_score_fast {42,63}
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_turngate            # gate_strength swept {0.0, 0.5, 1.0} via param_space

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
