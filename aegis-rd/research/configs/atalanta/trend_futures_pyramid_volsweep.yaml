name: atalanta_trend_futures_pyramid_volsweep
schema_version: 10
output_dir: runs/atalanta/trend_futures_pyramid_volsweep

# PYRAMIDING test on the futures substrate ([[what-makes-a-trend-sleeve-convex]] hypothesis #2, the one
# article shape-lever the codebase lacked). Same GLBX book + champion signal params as
# trend_futures_ls.yaml (trend_score lb252 + realized_vol vw63, full L/S), but the strategy is
# atalanta.trendStraddleBufferedPyramid: each name builds 0->full over `ramp_steps` bars of trend
# persistence, so gross floats up as trends mature (convex, builds the right tail) and down in chop.
# Pinned signal params + a small strategy grid isolate the lever: ramp_steps 1 == the buffered champion
# exactly (no-pyramid baseline), vs 21/63/126; with/without the 0.20 buffer. Ranked by quarterly skew
# (the shape the pyramid is supposed to deepen); sharpe + UPI emitted alongside for the held-out gate.
#
# DATA: aegis historical store (source: store, provider: databento). Each futures root carries its
# own Databento dataset; active GLBX roots below use GLBX.MDP3. Futures are our ratio back-adjusted
# continuous (adjustment: backward_ratio) — dated outright legs rolled on real expiry, gap-free.
# Store gap-fills from Databento on first run and caches to parquet (pull-once); key read from
# $DATABENTO_API_KEY. The store coverage pull is per-root sequential on the first run (no engine knob
# — store is a local source); later runs read the cache.
#
# IBKR SHORT-TRADEABILITY (2026-06-17, verified on the paper gateway with what-if previews): the live
# L/S universe is futures, because (a) US ETFs are PRIIPs/KID-blocked outright on this account and (b)
# UCITS ETCs carry thin-to-zero borrow, whereas a short future needs no borrow. All roots below are
# short-tradeable at IBKR; front-month initial margin (USD):
#   rates : ZT 1.2k  ZF 1.3k  ZN 1.9k  TN 2.5k  ZB 3.7k  UB 5.1k
#   FX    : 6E 3.5k  6J 2.6k  6B 2.2k  6A 2.3k  6C 1.3k  6S 4.7k  DX 2.3k
#   energy: CL 19k   BZ 16k   NG 7k    RB 24k   HO 30k
#   metals: GC 40k   SI 12k   HG 21k   PL 13k   PA 29k
#   ags   : ZC 1.5k  ZW 2.7k  ZS 3.7k  SB 1.6k  KC 17k  CT 3.2k
#   live  : LE 1.8k  (live cattle, CME/Globex — replaced cocoa CC)
# Per-symbol dataset (schema v10): each root carries its own Databento dataset, so CME/Globex and ICE
# roots mix in one universe. Coverage verified 2026-06-20 (subscription has GLBX.MDP3 + IFUS.IMPACT +
# IFEU.IMPACT). Venue map: TN and BZ are CME Globex (BZ = NYMEX Brent Last Day on GLBX.MDP3 — NOT the
# ICE "BRN"); DX and the softs SB/KC/CT are ICE-US (IFUS.IMPACT); LE (live cattle) is CME/Globex.
# All 30 roots are IBKR short-tradeable and now active.
data:
  source: store
  provider: databento     # futures bars (GLBX / IFUS)
  fx_provider: yfinance   # base-currency (EUR) FX gap-fill, decoupled from the bars provider:
                          # USD roots need an EURUSD rate, and store FX gap-fill is yfinance-only.
  arrays:
  - OHLCV
  symbols:
  - {root: ZT, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: ZF, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: ZN, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: TN, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}   # Ultra 10y note (CBOT/GLBX); IBKR short-tradeable, init margin ~$2.5k
  - {root: ZB, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: UB, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6E, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6J, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6B, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6A, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6C, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: 6S, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: DX, ccy: USD, dataset: IFUS.IMPACT, adjustment: backward_ratio}  # US Dollar Index (ICE-US); IBKR short-tradeable ~$2.3k
  - {root: CL, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: NG, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: RB, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: HO, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: BZ, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}   # NYMEX Brent Last Day (CME Globex, NOT ICE); IBKR short-tradeable ~$16k
  - {root: GC, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: SI, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: HG, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: PL, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: PA, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: ZC, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: ZW, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: ZS, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}
  - {root: SB, ccy: USD, dataset: IFUS.IMPACT, adjustment: backward_ratio}  # Sugar #11 (ICE-US); IBKR short-tradeable ~$1.6k
  - {root: KC, ccy: USD, dataset: IFUS.IMPACT, adjustment: backward_ratio}  # Coffee C (ICE-US); IBKR short-tradeable ~$17k
  - {root: CT, ccy: USD, dataset: IFUS.IMPACT, adjustment: backward_ratio}  # Cotton #2 (ICE-US); IBKR short-tradeable ~$3.2k
  - {root: LE, ccy: USD, dataset: GLBX.MDP3, adjustment: backward_ratio}    # Live Cattle (CME/Globex); IBKR short-tradeable ~$1.8k. Livestock diversifier replacing cocoa (CC), which a 2024 +148% melt-up made a single-name concentration; LE adds an uncorrelated sector the book lacked.
  start: '2019-01-01'   # IFUS.IMPACT (ICE roots DX/SB/KC/CT) history begins 2018-12-23;
                        # uniform 2019 start aligns all 30 roots on one clean window.
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
# Unpinned: each indicator's param_space drives the sweep, so this OPTIMIZES the convex shape on the
# article's three levers (what-makes-a-trend-sleeve-convex) instead of pinning the slow champion point.
#   speed       : trend_score lookback in [63, 126, 189, 252]  (faster lookback = more skew; 252 is the slow, skew-dead end)
#   vol window  : realized_vol vol_window in [21, 63, 126, 252] (a long vol window relative to the lookback restores skew)
#   pyramiding  : ramp_steps in [1, 21, 63]                     (add-to-winners deepens the right tail; inverted-U ~21)
# 4 x 4 x 3 = 48 candidates x 5 held-out splits, ranked on crisis_quarter_return.
- id: atalanta.trend_score
  params:
    lookback: 252
- id: atalanta.realized_vol

strategy:
  id: atalanta.trendStraddleBufferedPyramid
  params:
    entry_band: 0.0
    buffer_band: 0.20
    ramp_steps: 1

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003

ranking:
  metric: crisis_quarter_return

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
