name: atalanta_floor_btc_add
schema_version: 10
output_dir: runs/atalanta/floor-btc-add

# CRYPTO-AXIS drop-in (GH #80, [[the-orthogonal-non-equity-trend-universe]]): the champion 3-name floor
# + a Bitcoin trend leg (ABTCGBP, 21Shares Bitcoin, SIX GBP, MIC XBRU - inception 2020-07, addressed by
# its currency-specific local symbol ABTCGBP so the currency-less resolver returns a UNIQUE contract
# (bare BTCE.XETR collides EUR/CHF; WisdomTree BTCWUSD.XBRU resolves but has no TRADES prints on SIX -
# 21Shares is the deepest crypto ETP with fetchable TRADES). GBP-denominated -> EUR/GBP FX leg added.
# Hypothesis: BTC is the missing convex axis - the most positively-skewed liquid asset (Sepp: 3rd
# moment ~150%/yr), and vol-scaled trend gives it a fat right tail with a benign left tail (Man AHL),
# so it should LIFT held-out trend_convexity_payoff. BTC is not borrowable -> long-only-to-cash
# (Concretum's validated long-only crypto-trend implementation). USD-denominated (EUR/USD already in
# the book). Window 2020-01..2025-01 -> ~4-5 splits. Byte-identical harness to floor_btc_base.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF, WBTC.XPAR]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2021-07-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 2.0
  net_cap: 2.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
