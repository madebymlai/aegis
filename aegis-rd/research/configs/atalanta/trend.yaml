# CHAMPION — long-only atalanta trend pole (FORGO convention), promoted 2026-06-17 per
# aegis-rd-167, superseding the long/short straddle champion (now archive/trend_ls_champion.yaml).
# Same 20-name orthogonal non-equity LSE universe, indicators and params (trend_score lb252 +
# realized_vol vw63 + turnover buffer bb0.20, eb0.0) as the prior champion, but long-only:
# downtrends take no position (budget held as cash; gross <= 1). Evidence (aegis-rd-167): on this
# non-equity universe shorting is NET-NEGATIVE (held-out Sharpe 0.62 L/S -> 0.89 long-only) and
# half the names are un-borrowable for retail (IBKR probe); the crisis convexity (qskew 2.67
# full-sample) comes from the long legs, not the shorts. FORGO (cash-when-flat) beats gross-1
# redeploy on Sharpe/UPI/qskew and halves the tail drawdown; the multi-horizon 63/252 barbell was
# tested and REJECTED out-of-sample (dominated: held-out Sharpe 0.79 / UPI 2.21 vs 0.89 / 3.27).
# Pinned winner (role: best) for execution-bundle export.
