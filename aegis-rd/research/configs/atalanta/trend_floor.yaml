# ════════════════════════════════════════════════════════════════════════════════════════════════
# ATALANTA — the definitive convex trend sleeve (the floor's long-gamma "drawdown payer").
# ════════════════════════════════════════════════════════════════════════════════════════════════
# COMMODITY LEG PROMOTED 2026-07-10: ICOM (naive front-month BCOM) -> WCOA (WisdomTree optimised-roll).
# Promotion decided on a 6-split matched window (2018..2024-12-31): convexity 0.4252 vs ICOM 0.4451 -
# a statistical WASH (paired t=-1.08, n=6) - with WCOA a real edge on the SECONDARIES (Sharpe, maxDD,
# best on the worst reversal/whipsaw split). A JUDGMENT-CALL promotion: WCOA TIES (does not beat) the
# ranked convexity primary, so this is a deliberate choice to bank the drawdown/Sharpe/whipsaw edge at
# neutral convexity (not a rule-based auto-replace).
# LOCKED on the FULL window (2018..2026-07-01, 7 splits): convexity 0.4183 (convex on all 7 splits),
# Sharpe 1.323 (past #80's 1.15 target), maxDD 6.61. `end` extended to 2026 (not trimmed) - the valid
# 2025-26 fetch range sidesteps the empty-top-up clash, and the extra year adds statistical power to
# the marginal promotion. WCOA's 5 old LSE-calendar gaps are ffilled in the catalog (0.3% of bars);
# an INCREMENTAL top-up appends and preserves them - only a full catalog rebuild would drop the ffill.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# Role ([[the-tiered-strategy-roster]]): the FLOOR-tier long-gamma pole — bleeds a little in calm,
# pays out in dislocation, buying the income engine time to recover. Ranked on convexity, never
# Sharpe. This config is the endpoint of the 2026-06 research arc; every other atalanta config and
# component has been archived. The journey, in the numbers (held-out trend_convexity_payoff):
#   old champion (equity-heavy, buffered)            -0.04 .. -0.23   (NEGATIVE convexity, ~400 fills)
#   hysteretic FORGO + drift band, 4-name incl equity   0.294        (7.5 fills/yr)
#   DROP EQUITY -> non-equity substrate                 0.365        (5.0 fills/yr)   <- the big lever
#   + band 0.15                                          0.376        (4.0 fills/yr)
#   + IDTL short                                         0.372        (~6 fills/yr)   <- drawdown-payer
#   + asymmetric drift band                              0.424        (8.7 fills)
#   + one-sided short cap (short_cap 0.10, this config)  0.447        (mean DD 8.58->7.18; worst-split DD 13.45->6.85; UPI 6.21->7.02)
# The IDTL short ties the long-only book on average convexity but concentrates payoff into the
# inflation-crisis dislocation (2022: +30% vs +21%, conv +0.85 vs +0.68) and lands its give-back in
# the recovery when the hedge is not needed — the purer drawdown-payer shape, so it is the default.
#
# WHY EACH CHOICE (all validated, mostly in USD base — conclusions are currency-agnostic):
#  - UNIVERSE: NON-equity, the minimal orthogonal macro-crisis set. Equity (VWRD) was a convexity
#    DRAG (drop-one-name +0.052) and violates the roster's non-equity substrate rule (an equity-
#    collinear book realizes SHORT gamma under a trend label). Gold and broad commodity are the
#    convexity ENGINES (drop-one-name +0.105 / +0.119), hedging different crisis quadrants:
#       IDTL.LSEETF  US Treasury 20+yr   deflation/flight-to-safety leg (long) + the SHORT-bond leg
#       IGLN.LSEETF  gold                generic/deflation/geopolitical crisis hedge (long-only)
#       WCOA.LSEETF  broad commodity     inflation-crisis hedge (long-only, optimised-roll)
#    Breakout (binary Donchian 0.11, continuous Carver 0.18) and the endpoint score all LOST to the
#    regression slope on convexity; uranium/leveraged/CTA universes are blocked on data (youth,
#    null-Close illiquidity, non-existence) — see archived configs.
#  - SIGNAL: trend_score_regress — annualized OLS slope of log price (smooth sign, few whipsaw
#    flips). Champion lookback fixed at 189.
#  - SIZING: realized_vol pinned at a LONG 126-bar window — a long lookback paired with a SHORT vol
#    window negates positive skew (Research Affiliates); pinned so the skew-preserving choice is
#    baked, not left to the ranker.
#  - STRATEGY: keystone_shortmute — hysteretic Schmitt-trigger sign (sticky, low turnover) +
#    continuous magnitude (convex) + FORGO cash-when-flat (gross <= 1). IDTL is shorted on a confirmed
#    down-trend (borrow-gated, parity-safe); IGLN/WCOA forgo to cash. enter/exit dead-zone fixed.
#  - SHORT CAP: the IDTL short *reading* is one-sided-capped at short_cap=0.10 (annualized-score
#    units), longs uncapped, freed gross -> cash. The short at full size is mostly left-tail whipsaw
#    (worst-split drawdown 13.45->6.85 when capped) while a small capped short keeps the crisis-
#    conditional return a true long-only gives up. Pareto-promoted 2026-06-29 ([[runs/atalanta/2026-06-29]]):
#    convexity 0.424->0.447, mean DD 8.58->7.18, UPI 6.21->7.02; trades ~5% crisis-conditional return
#    for the gain. 0.10 is the robust middle - the metric-max peak moved 0.05 (UCITS) -> 0.2 (US-ETF
#    2017-24 cross-instrument stress), so 0.10 over-fits neither.
#  - HOLDING: portfolio drift band, NOT a per-bar buffer or NaN-hold — the only holding mechanism
#    the LIVE rebalancer mirrors (a realized-space per-name drift band). The promoted champion uses
#    asymmetric buy/hold spread semantics: band_down=0.20 gates adds, band_up=0.10 gates trims.
#
# EUR base (Italy/IBKR-IE retail, ~EUR 5k): the three USD-quoted legs convert via the EUR/USD FX
# pair (the FX-fetch fix is required and in place). First run needs the IB gateway up to fetch
# EUR/USD; warm thereafter.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, WCOA.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2026-07-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 2.0  # raised 2026-07-05 (B1): ceiling only - sleeve weights unchanged; lets the book allocator re-lever the diversification dividend (GH #79 B1, #80)
  net_cap: 2.0    # raised with gross (B1): ceiling only
  # both: long IGLN/WCOA + borrow-gated IDTL short. Short borrow carry priced by the portfolio (ADR-0008).
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
