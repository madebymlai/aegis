name: atalanta_trend_futures_bento
schema_version: 9
output_dir: runs/atalanta/trend_futures_bento

# FUTURES trend sleeve on the AEGIS HISTORICAL STORE (source: store, provider: databento). Migrated
# off Databento server-side continuous (stype_in: continuous, ROOT.c.0) — that was a RAW stitched
# front month, NOT price-adjusted, so a roll seam left a gap a trend signal misreads. The store now
# serves OUR continuous history: dated GLBX outright contracts, rolled on each contract's real expiry
# (instrument-definition driven) and RATIO back-adjusted (adjustment: backward_ratio) into a gap-free
# series. The store gap-fills from Databento on first run and caches each leg to parquet, so the pull
# is once-and-amortized; later runs read the cache. NO provider_kwargs (store is a local source); the
# API key is read from $DATABENTO_API_KEY by the pull, never committed. (Name retains "bento" for run
# continuity; the data path is now the store.)
#
# MECHANISM unchanged and already validated (2026-06-14 diary): atalanta.trendStraddleBuffered
# (conviction/magnitude-weighted inverse-vol straddle + turnover buffer) on atalanta.trend_score +
# atalanta.realized_vol. With free shorting the FULL L/S straddle (direction both, short_policy "all"
# by construction) is the right variant — no borrow mask, no un-borrowable substitutions. This tests
# the roster's substrate claim directly: futures reach rates+FX+energy+metals+ags two-sided at far
# higher independent-bet breadth than the borrow-constrained London ETC book.
#
# UNIVERSE: 23 CME-family futures on GLBX.MDP3 (one dataset, all two-sided, equity-index DELIBERATELY
# excluded per the non-equity substrate requirement). ICE softs (KC/SB/CC/CT cocoa-etc.) and Brent
# live on ICE datasets (IFUS/IFEU), not GLBX.MDP3 — a second-dataset extension once this GLBX cut is
# validated.
#   rates (CBOT)  5 : ZT ZF ZN ZB UB     (2y/5y/10y/30y/ultra-bond)
#   FX   (CME)    6 : 6E 6J 6B 6A 6C 6S   (EUR JPY GBP AUD CAD CHF)
#   energy(NYMEX) 4 : CL NG RB HO         (WTI/natgas/gasoline/heating oil)
#   metals(CMX/NY)5 : GC SI HG PL PA      (gold/silver/copper/platinum/palladium)
#   ags  (CBOT)   3 : ZC ZW ZS            (corn/wheat/soybean)
data:
  source: store
  provider: databento                 # gap-fill futures legs from Databento; key from $DATABENTO_API_KEY
  dataset: GLBX.MDP3
  arrays:
  - OHLCV
  symbols:
  # futures store symbols: root identity + ratio back-adjust (roll_rule defaults to calendar).
  # --- rates: US curve (CBOT) ---
  - {root: ZT, ccy: USD, adjustment: backward_ratio}
  - {root: ZF, ccy: USD, adjustment: backward_ratio}
  - {root: ZN, ccy: USD, adjustment: backward_ratio}
  - {root: ZB, ccy: USD, adjustment: backward_ratio}
  - {root: UB, ccy: USD, adjustment: backward_ratio}
  # --- FX (CME) ---
  - {root: 6E, ccy: USD, adjustment: backward_ratio}
  - {root: 6J, ccy: USD, adjustment: backward_ratio}
  - {root: 6B, ccy: USD, adjustment: backward_ratio}
  - {root: 6A, ccy: USD, adjustment: backward_ratio}
  - {root: 6C, ccy: USD, adjustment: backward_ratio}
  - {root: 6S, ccy: USD, adjustment: backward_ratio}
  # --- energy (NYMEX) ---
  - {root: CL, ccy: USD, adjustment: backward_ratio}
  - {root: NG, ccy: USD, adjustment: backward_ratio}
  - {root: RB, ccy: USD, adjustment: backward_ratio}
  - {root: HO, ccy: USD, adjustment: backward_ratio}
  # --- metals (COMEX/NYMEX) ---
  - {root: GC, ccy: USD, adjustment: backward_ratio}
  - {root: SI, ccy: USD, adjustment: backward_ratio}
  - {root: HG, ccy: USD, adjustment: backward_ratio}
  - {root: PL, ccy: USD, adjustment: backward_ratio}
  - {root: PA, ccy: USD, adjustment: backward_ratio}
  # --- ags (CBOT) ---
  - {root: ZC, ccy: USD, adjustment: backward_ratio}
  - {root: ZW, ccy: USD, adjustment: backward_ratio}
  - {root: ZS, ccy: USD, adjustment: backward_ratio}
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.trend_score
- id: atalanta.realized_vol

strategy:
  id: atalanta.trendStraddleBuffered

portfolio:
  base_currency: EUR          # EUR investor: USD-quoted legs convert to EUR (realized P&L carries USD/EUR)
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003

ranking:
  metric: ulcer_performance_index

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
