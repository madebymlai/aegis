name: atalanta_floor_dropin_base
schema_version: 10
output_dir: runs/atalanta/floor-dropin-base

# DROP-ONE-IN baseline (GH #80, [[the-orthogonal-non-equity-trend-universe]]): the CURRENT
# champion 3-name floor (IDTL/IGLN/WCOA), UNLOCKED, so the +axis arm shares a byte-identical
# harness (window, split, pinned params) and the only difference across the two runs is the
# universe. Ranked on held-out trend_convexity_payoff. Champion params pinned (lookback 189,
# vol 126, short_cap 0.10) - the pinned-champion diagnostic, isolating the universe effect.
# Refreshed 2026-07-11 to the WCOA champion + 2026 window (the archived base was the stale
# ICOM/end-2025 harness); reproduces the locked champion's held-out convexity to confirm the
# read is apples-to-apples before the +JPY arm is judged against it.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, WCOA.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2026-07-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 2.0
  net_cap: 2.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
