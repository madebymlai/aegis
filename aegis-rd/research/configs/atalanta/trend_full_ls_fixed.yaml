name: atalanta_trend_full_ls_fixed
schema_version: 8
output_dir: runs/atalanta/trend_full_ls_fixed

# A/B control (aegis-rd-167): the fully-shortable 19-axis book (trend_full_ls) at the SAME FIXED
# champion params as the shortmask book trend_subst_ls (trend_score lb252 + realized_vol vw63 +
# buffer_band 0.20, entry_band 0.0), so the only differences vs trend_subst_ls are UNIVERSE
# (19 all-borrowable curated vs the original 20 incl un-borrowable ags/softs/natgas/FX) and SHORT
# POLICY (short all 19 vs short the 14 borrowable + hold 6 long-only). Removes the grid-selection
# bias of trend_full_ls so held-out UPI compares like-for-like with trend_subst_ls.
data:
  source: yf
  arrays:
  - OHLCV
  symbols:
  - {ticker: IDTL.L, ccy: USD, mic: XLON}
  - {ticker: IBTA.L, ccy: USD, mic: XLON}
  - {ticker: ITPS.L, ccy: GBP, mic: XLON}
  - {ticker: SEGA.L, ccy: GBP, mic: XLON}
  - {ticker: IEGE.L, ccy: EUR, mic: XLON, isin: IE00B3FH7618}
  - {ticker: INXG.L, ccy: GBP, mic: XLON}
  - {ticker: EMCP.L, ccy: GBP, mic: XLON}
  - {ticker: HYLD.L, ccy: USD, mic: XLON}
  - {ticker: IGLN.L, ccy: USD, mic: XLON, figi: BBG001M8D7W0}
  - {ticker: ISLN.L, ccy: USD, mic: XLON, figi: BBG001M8F4G3}
  - {ticker: COPA.L, ccy: USD, mic: XLON, figi: BBG000BL3W79}
  - {ticker: BRNT.L, ccy: USD, mic: XLON}
  - {ticker: CMOD.L, ccy: USD, mic: XLON}
  - {ticker: AIGE.L, ccy: USD, mic: XLON}
  - {ticker: CORN.L, ccy: USD, mic: XLON}
  - {ticker: SPLT.L, ccy: GBP, mic: XLON}
  - {ticker: IEML.L, ccy: USD, mic: XLON, isin: IE00B5M4WH52}
  - {ticker: IBCI.L, ccy: GBP, mic: XLON, isin: IE00B0M62X26}
  - {ticker: IGLT.L, ccy: GBP, mic: XLON, isin: IE00B1TXLS18}
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
- id: atalanta.trend_score
  params:
    lookback: 252
- id: atalanta.realized_vol
  params:
    vol_window: 63

strategy:
  id: atalanta.trendStraddleBuffered
  params:
    entry_band: 0.0
    buffer_band: 0.20

portfolio:
  gross_cap: 1.0
  direction: both
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003

ranking:
  metric: ulcer_performance_index

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
