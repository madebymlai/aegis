name: atalanta_trend_volsota
schema_version: 10
output_dir: runs/atalanta/trend-volsota

# ════════════════════════════════════════════════════════════════════════════════════════════════
# SOTA VOL-ESTIMATOR SWAP on the live champion (atalanta trend.yaml). The last best-practice-alignment
# gap from the 2026-07-03 full-spectrum audit.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# The champion sizes on CLOSE-TO-CLOSE rolling std (the 1x-efficiency baseline). SOTA for daily OHLC is
# Yang-Zhang (8-14x efficient, drift-independent - Baltas-Kosowski's chosen estimator) or a matched-memory
# EWMA (MOP/RiskMetrics family). The literature is explicit that this is a TURNOVER lever, not a return
# lever: Baltas-Kosowski find the estimator has NO economically significant pre-cost Sharpe effect but
# Yang-Zhang cuts turnover ~17% "without a statistically significant performance impact". On this fixed-
# EUR-1.25/order EUR 5k book turnover IS net return, so the test is: SAME convexity, FEWER fills / lower
# fees. At the long vw126 the precision gain shrinks (60+ obs, ctc converges - FlashAlpha), so the
# convexity prior is modest and flat-convexity is the expected, acceptable outcome.
#
# Only the indicator changes: atalanta.realized_vol -> atalanta.realized_vol_sota (same "realized_vol"
# output, drop-in), estimator LOOP-EDITED over {ctc (=champion, parity control), ewma, yang_zhang}. The
# EWMA is span=vol_window (mean-age matched to the equal window - the slow/convex-safe choice, NOT the
# fast lambda=0.94 that RA show negates skew on a long-lb book). Everything else pinned to trend.yaml
# (keystone_shortmute short_cap 0.10, lb189, vw126, asymmetric band, EUR EUR5k, IDTL borrow-gated). Data
# warm (IDTL/IGLN/ICOM cached, OHLCV already loaded). No lock (a sweep). See [[runs/atalanta/2026-07-03]].
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol_sota
    params:
      vol_window: 126
      estimator: ctc        # loop-edit: ctc (parity control) -> ewma -> yang_zhang

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
