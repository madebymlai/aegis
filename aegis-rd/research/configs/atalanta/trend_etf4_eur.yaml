name: atalanta_trend_etf4_eur
schema_version: 10
output_dir: runs/atalanta/trend_etf4_eur

# SMALL-ACCOUNT STARTER (~EUR 5k retail, Italy/IBKR-IE). A 4-ETF long-only trend book an
# undercapitalised account can actually run: futures are too chunky (1 contract = a large indivisible
# notional) and US ETFs are PRIIPs/KID-blocked for EU retail, so this is broad UCITS ETFs bought
# whole/fractional via IBKR. Same champion signal stack as the trend pole (atalanta.trend_score lb252 +
# realized_vol vw63, buffered long-only entry_band 0 / buffer_band 0.20). Long-only by necessity AND
# evidence: UCITS borrow is thin-to-zero for retail (can't short) and shorting was NET-NEGATIVE on this
# non-equity book (held-out Sharpe 0.62 L/S -> 0.89 long-only, aegis-rd-167). FORGO/cash-when-flat, gross <= 1.
#
# UNIVERSE — a non-equity-tilted UCITS book (10 names, 9 non-equity) read as native Nautilus ids
# {localSymbol}.LSEETF. IBKR lists these on exchange LSEETF (NOT plain LSE) and nautilus has no MIC for it,
# so the venue token IS "LSEETF": possible_exchanges_for_venue falls back to [venue] and _decode_stock_contract
# emits IBContract(STK, SMART, primaryExchange=LSEETF, localSymbol=<sym>), which resolves uniquely. All
# verified live on the paper gateway (conId + pre-2018 history); currency catalog-authoritative, converted
# to the EUR base. The breadth is deliberate: the convexity notes require a NON-equity-dominated substrate
# and independent macro bets (rates curve, global/€ rates, inflation, credit, metals, broad commodity);
# the 4-name equity-heavy book before this realized NEGATIVE convexity, exactly as the notes predict.
#   VWRD.LSEETF  global equity      107968716  Vanguard FTSE All-World UCITS USD Dist (the buyable VWCE is the same fund)
#   IBTA.LSEETF  US rates short     272686955  iShares $ Treasury 0-1yr / short
#   IDTL.LSEETF  US rates long      181150836  iShares $ Treasury 20+yr
#   IGLO.LSEETF  global govt        59262759   iShares Global Govt Bond
#   ITPS.LSEETF  US inflation (GBP) 68489991   iShares $ TIPS
#   HYLD.LSEETF  credit / high yld  116975453  iShares $ High Yield Corp
#   IGLN.LSEETF  gold               86656182   iShares Physical Gold ETC
#   ICOM.LSEETF  broad commodities  282849246  iShares Diversified Commodity Swap (Bloomberg Commodity)
# DROPPED: SEGA (EUR govt, 51 no-trade gaps) and SSLV (silver, 9 gaps) — illiquid LSE listings whose
# TRADES bars have holes the quality gate rejects (no ffill in MissingPolicy). The kept 8 are gap-free (1769 bars).
data:
  base_currency: EUR
  instruments: [VWRD.LSEETF, IBTA.LSEETF, IDTL.LSEETF, IGLO.LSEETF, ITPS.LSEETF, HYLD.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
# Unpinned: each component's param_space drives the sweep (grid search).
#   trend_score.lookback   in [63, 126, 189, 252]   (speed)
#   realized_vol.vol_window in [21, 63, 126, 252]    (inverse-vol sizing / convexity lever)
# strategy entry_band in [0.0, 0.05] x buffer_band in [0.0, 0.10, 0.20, 0.30] (dead-zone x no-trade band)
# 4 x 4 x 2 x 4 = 128 candidates x held-out splits, ranked on crisis_quarter_return.
- id: atalanta.trend_score
- id: atalanta.realized_vol

strategy:
  id: atalanta.trendStraddleBufferedLongOnly

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: longonly
  # Account NAV the book is sized and costed against. A fixed per-order fee is
  # ABSOLUTE, so its drag is NAV-dependent — 5000 models the live EUR retail account
  # (at the default 10_000 the same fee halves to ~half the drag).
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  # IBKR EUR Tiered per-order MINIMUM commission, charged per fill on top of `fees`.
  # Execution-side counterpart: aegis-trader's IbkrPerShareFeeModel.min_commission_per_order
  # (Nautilus). vbt's `fixed_fees` charges it as a flat add-on rather than a true
  # max(min, per_share*qty) floor, which matches the trader model in the small-order
  # regime where the floor binds — i.e. exactly the 5k case.
  fixed_fee: 1.25

ranking:
  # trend_convexity_payoff (benchmark-free convexity) — a trend sleeve is hired for the convex/
  # positive-skew shape, and ranking on Sharpe/Calmar/UPI systematically selects the LEAST convex book
  # ([[what-makes-a-trend-sleeve-convex]]). The benchmark-relative metrics (crisis_quarter_return etc.)
  # need SPY (vbt.YFData) and NaN-degrade on this catalog-only/offline book; this one reads the convex
  # shape from the stream's own overlapping 2-6mo tails (Sepp 2018 quarterly horizon), and is
  # magnitude-aware so it rewards crisis CAPTURE, not just a normalized skew coefficient.
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
