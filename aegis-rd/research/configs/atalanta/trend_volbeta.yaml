name: atalanta_trend_volbeta
schema_version: 10
output_dir: runs/atalanta/trend-volbeta

# ════════════════════════════════════════════════════════════════════════════════════════════════
# ATALANTA VOL-SCALING-EXPONENT SWEEP (GH #80, [[runs/atalanta/2026-07-09#volbeta]]).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# Closes the SIZING axis: does de-emphasizing the high-vol (crisis-paying) legs lift convexity?
# Champion keystone_shortmute divides the leg magnitude by realized_vol (vol_beta=1). This sweeps
# the exponent vol_beta in {0, 0.25, 0.5, 0.75, 1.0}; vol_beta=1 is the nested control and MUST
# reproduce the locked champion trend_convexity_payoff 0.447 bit-for-bit.
#
# Honest prior (LOW-MEDIUM, pre-registered): Kaminski-Hoffman say inverse-vol sizing has the lowest
# skew; but Carver's decisive test shows reducing vol-targeting moves SKEW without improving the
# RIGHT tail - and our metric is right-tail-minus-left-tail, so it may not move. Also, on this
# gross-normalized FORGO book vol appears in both numerator and gross divisor, so vol_beta only
# re-weights the cross-sectional split (not the full time-series ERT mechanism). Expected ~null.
#
# PRE-REGISTERED keep/kill (held-out, ranked on trend_convexity_payoff; Sharpe reported not ranked):
#   KEEP if some vol_beta != 1 clears BOTH: (1) trend_convexity_payoff >= 0.447 by > CI (a real lift,
#   not within-noise); (2) worst calm year >= -6% AND worst-split maxDD <= champion + 1pp.
#   KILL if convexity is flat/declining in vol_beta or any lift is within CI (Friedman indistinct) -
#   the sizing axis is closed, the champion's inverse-vol is convexity-optimal for this book.
#
# Identical universe / window / splits / portfolio to the champion (trend_floor.yaml); ONLY the
# strategy's vol exponent changes. USD legs convert to EUR via EUR/USD (gateway up for cold fetch).
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_volbeta        # vol_beta swept {0,0.25,0.5,0.75,1.0}; bands/short_cap pinned
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 2.0
  net_cap: 2.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
