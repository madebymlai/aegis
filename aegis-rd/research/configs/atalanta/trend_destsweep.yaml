name: atalanta_trend_destsweep
schema_version: 10
output_dir: runs/atalanta/trend-destsweep

# ════════════════════════════════════════════════════════════════════════════════════════════════
# REBALANCE-DESTINATION SWEEP on the live champion (atalanta trend.yaml). The band-gate dial.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# First test of the new `band_destination_fraction` knob, from
# [[allocating-and-rebalancing-a-multi-strategy-book]] (rebalancing section): with proportional
# costs the optimal breach trade stops at the band EDGE (Leland/NBIM); with a per-order fee floor
# it goes INTERIOR - fewer, larger trades amortize the floor (Holden). This book is fee-floor
# dominant (EUR 5k NAV, EUR 1.25/order floor: a 10%-NAV trade pays ~EUR 0.65 proportional < 1.25
# floor), so the PRE-REGISTERED expectation is f=1.0 ~= f=0.5 > f=0.0: edge-trading (f=0) leaves
# the position at the band boundary, so the next drift re-breaches sooner and pays the floor again
# at half the trade size - the worst case under a floor.
#
# Everything is pinned to the champion (keystone_shortmute short_cap 0.10, lb189, vol_window 126,
# asymmetric band 0.10/0.20, EUR 5k); ONLY portfolio.band_destination_fraction is loop-edited over
# {1.0 (= champion control, known held-out conv 0.447 / meanDD 7.18 / ~8.7 fills/yr), 0.5, 0.0}.
# Data warm (IDTL/IGLN/ICOM + EUR/USD cached). No lock (a sweep). See [[runs/atalanta/2026-07-03]]
# for keep/kill.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_shortmute
  params:
    enter_band: 0.10
    exit_band: 0.05
    short_cap: 0.10

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20
  band_destination_fraction: 1.0   # SWEEP DONE (2026-07-03): 1.0 kept; 0.5 conv 0.3819, 0.0 fill-storm

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
