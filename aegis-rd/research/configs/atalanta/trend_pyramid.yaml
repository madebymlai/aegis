name: atalanta_trend_pyramid
schema_version: 10
output_dir: runs/atalanta/trend-pyramid

# ════════════════════════════════════════════════════════════════════════════════════════════════
# EXTENSION-DRIVEN PYRAMIDING on the live champion (atalanta trend.yaml).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# The one convexity lever [[what-makes-a-trend-sleeve-convex]] ranks #1 in BOTH the literature and our
# own house recipe, and the only response-function shape untested on the live champion. Pyramiding =
# add to winners: each trend leg's magnitude ramps from cash to full size as the OPEN TRADE EXTENDS in
# its own direction (Mulvaney's r = open-profit/initial-risk multiplier; Concretum's VolParity+Pyramiding,
# Profit Factor 1.74 > 1.55 > 1.48; CFM "build up as trends get bigger -> assume risk infrequently ->
# fat right tail"). The champion's inverse-vol sizing is a structural TAKE-PROFIT (Quantica: it cuts the
# top-quartile winners' notional ~30% as vol rises into the trend) - pyramiding is the corrective. It is
# represented as an EXTENSION ramp (vol-normalized favorable move since the latch entry), NOT the archived
# time-in-trend proxy, per the SOTA sources - see the keystone_pyramid component header.
#
# Everything is pinned to the champion (keystone_shortmute short_cap 0.10, lb189, vw126, asymmetric drift
# band, EUR EUR5k, IDTL borrow-gated); the strategy is swapped to atalanta.keystone_pyramid, whose
# param_space sweeps the ramp threshold pyr_r {0.0 (=off, nested champion control), 0.25, 0.50, 1.00} at
# pyr_floor 0.0 (fresh trends start in cash and build). gross<=1 throughout: the ramp only ever de-risks
# toward cash, never levers (EUR 5k UCITS). No new indicator (trend_score + realized_vol are the champion's;
# pyramiding is a pure position-management overlay). Data warm (IDTL/IGLN/ICOM cached). No lock (a sweep).
# See [[runs/atalanta/2026-07-03]] for the pre-registered keep/kill.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_pyramid   # ramp threshold swept via param_space (pyr_r {off,0.25,0.5,1.0}, pyr_floor 0.0)

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: both
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
