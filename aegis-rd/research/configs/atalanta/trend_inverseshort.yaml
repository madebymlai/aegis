name: atalanta_trend_inverseshort
schema_version: 10
output_dir: runs/atalanta/trend-inverseshort

# ════════════════════════════════════════════════════════════════════════════════════════════════
# INVERSE-ETF SHORT LEG on the live champion (atalanta trend.yaml).
# ════════════════════════════════════════════════════════════════════════════════════════════════
# Hypothesis ([[trend-following-under-a-fixed-per-order-fee]], short-leg section): take the Treasury
# short NOT as a borrow-gated NEGATIVE weight on IDTL (what keystone_shortmute caps) but as a LONG
# weight on a paired -1x inverse Treasury ETF. The book goes LONG-ONLY (no borrow, direction: long).
# The -1x daily-reset decay is carried by the ETF price and lands FAVOURABLY on a trend-gated hold
# (decay coefficient 1 * realized variance -> small in a sustained down-trend, biting only in chop,
# which the hysteretic latch excludes). Thesis: the cleaner instrument lets the short run UNCAPPED
# (inv_cap 1.0) without the whipsaw-blowup the borrow-gated short suffered - recovering the 2022
# crisis capture that short_cap 0.10 gives up (see [[runs/atalanta/2026-07-03]]).
#
# !! STATUS 2026-07-03: PARKED. E572 below is DELISTED (Lyxor -1x US-Tsy liquidated 2021, LEI lapsed)
# and NOT carried on IBKR (error 200). No -1x US-Treasury UCITS is tradable on the account; the only
# live UCITS -1x is DXSV (Xtrackers Short EUR Sovereigns, `DXSV.IBIS2`, EUR-native, curve-substituted).
# Decay physics + a decay-free borrow short keep the borrow-gated IDTL short champion; this config is
# the vehicle for a DXSV -1x fallback ONLY if IDTL borrow is ever lost. See [[runs/atalanta/2026-07-03]].
#
# INSTRUMENT: E572 = Amundi/Lyxor US Treasury Bond Future Daily (-1x) Inverse UCITS ETF
# (ISIN LU1275255286, Solactive US Treasury 15-25yr -1x, swap-based, TER 0.20%, launched Oct-2015 so
# 2018-2025 incl. the 2022 bond crash is in-window). Duration-matches IDTL (20+yr). NOT LSE-listed;
# taken on Xetra (IBKR exchange IBIS, EUR-quoted -> no FX leg for it, base is EUR). -1x ONLY, never
# the -2x (E573) sibling: the article's "never a -2x for holding" (decay coefficient jumps 1 -> 3).
#
# The pairing (E572 realizes the IDTL short) is baked into atalanta.keystone_inverseshort: the FORGO
# gross is the champion's byte-identical base-book divisor over [IDTL, IGLN, ICOM], IDTL's down-
# conviction is routed to a LONG E572 weight, and E572's own score never enters the book. So the ONLY
# variable vs the champion is the short's INSTRUMENT. inv_cap swept {1.0, 0.20, 0.10} (1.0 = uncapped;
# 0.10 = the champion's cap, an instrument-only A/B). Ranked on trend_convexity_payoff.
#
# CAVEAT: E572 (Xetra) and the three LSE legs sit on different exchange calendars, so missing_index:
# drop intersects them (a modest day loss on non-shared holidays). Tiny AUM (~5-6m) -> live spread is
# an operator check, not a backtest concern on daily bars. First run needs the IB gateway up to fetch
# E572 (warm thereafter); the three LSE legs + EUR/USD are already cached.
data:
  base_currency: EUR
  instruments: [IDTL.LSEETF, E572.IBIS, IGLN.LSEETF, ICOM.LSEETF]
  exchange: [EUR/USD.IDEALPRO]
  arrays: [OHLCV]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  missing_index: drop

indicators:
  - id: atalanta.trend_score_regress
    params:
      lookback: 189
  - id: atalanta.realized_vol
    params:
      vol_window: 126

strategy:
  id: atalanta.keystone_inverseshort           # inv_cap swept {1.0, 0.20, 0.10} via param_space

portfolio:
  base_currency: EUR
  gross_cap: 1.0
  direction: longonly
  init_cash: 5000.0
  fees: 0.0005
  slippage: 0.0005
  fx_conversion_cost: 0.0003
  fixed_fee: 1.25
  band_up: 0.10
  band_down: 0.20

ranking:
  metric: trend_convexity_payoff

optimization:
  search: grid
  seed: 42
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
