schema_version: 10
name: tests_tune_lock_mom
output_dir: runs/etf_vanguard_tune

data:
  source: yf
  symbols: [{ticker: SPY, ccy: EUR}, {ticker: IWM, ccy: EUR}, {ticker: EEM, ccy: EUR}, {ticker: TLT, ccy: EUR}, {ticker: GLD, ccy: EUR}, {ticker: DBC, ccy: EUR}, {ticker: VNQ, ccy: EUR}, {ticker: UUP, ccy: EUR}, {ticker: XLE, ccy: EUR}, {ticker: XLU, ccy: EUR}]
  start: '2018-01-01'
  end: '2025-01-01'
  timeframe: 1D
  arrays: [OHLCV]

portfolio:
  gross_cap: 0.8
  direction: longonly
  fees: 0.0005
  slippage: 0.0005

strategy:
  id: tests.momentum_rotator

indicators:
  - id: tests.momentum_score
    # Frozen Indicator: values-only params: replace the removed per-Component
    # lock_id (ADR-0006). The Strategy and realized_vol keep optimizing.
    params:
      h1: 15
      h2: 42
      h3: 100
      h4: 200
      w1: 8.0
      w2: 4.0
      w3: 3.0
      w4: 2.0
  - id: tests.realized_vol

ranking:
  metric: sharpe_ratio

optimization:
  search: grid
  seed: 23
  split:
    method: from_rolling
    params:
      length: 504
      offset: 0
      split: 0.5
    max_splits: 10
    max_estimated_output_cells: 1000000000
    max_public_artifact_bytes: 20000000
