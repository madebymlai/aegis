[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-rd"
version = "0.1.0"
description = "VectorBT PRO-first research loop for strategy evidence and backtesting."
requires-python = ">=3.12"
dependencies = [
  "aegis-runtime",
  "aegis-data",
  "dill",
  "numpy",
  "pandas",
  "pathos>=0.3.5",
  "pydantic>=2.0",
  "pyyaml",
  "tomlkit",
  "vectorbtpro",
  "yfinance>=0.2.56",
]

[project.scripts]
aerd = "research.aegis_research.cli:main"

[tool.setuptools.packages.find]
include = ["research*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  # vectorbtpro's pathos parallel engine forks worker processes; on Python 3.13 the
  # multiprocess backend warns that forking a multi-threaded process is risky. This is
  # intrinsic to how pathos spawns workers and is not actionable from our code.
  "ignore:.*use of fork\\(\\) may lead to deadlocks.*:DeprecationWarning",
]

[tool.uv.sources]
aegis-runtime = { path = "../aegis-runtime", editable = true }
aegis-data = { path = "../aegis-data", editable = true }
vectorbtpro = { git = "https://github.com/polakowo/vectorbt.pro.git", branch = "develop" }

[tool.mypy]
python_version = "3.12"
files = ["research"]

# These third-party libraries ship no type stubs; suppress the missing-import
# noise without weakening checks on our own code.
[[tool.mypy.overrides]]
module = [
  "vectorbtpro.*",
  "pandas",
  "pandas.*",
  "yaml",
  "aegis_runtime",
  "aegis_runtime.*",
  "aegis_data",
  "aegis_data.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/**", "research/components/**"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes: undefined names, unused imports
  "I",    # import sorting
  "UP",   # modern Python syntax
  "B",    # likely bugs and unsafe patterns
  "C4",   # cleaner comprehensions
  "SIM",  # simpler control flow
  "RET",  # clearer returns
  "TRY",  # exception-handling hygiene
  "PERF", # obvious performance footguns
  "PTH",  # pathlib consistency
  "PIE",  # miscellaneous cleanup rules
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",   # let the formatter handle wrapping; long literals/messages can stay readable
  "PERF401", # explicit loops are often clearer for accumulating validation issues
  "TRY003", # keep concise domain errors without forcing custom exception classes everywhere
]

[dependency-groups]
dev = [
    "bm25s>=0.3.9",
    "ipykernel>=7.2.0",
    "jupytext>=1.16.0",
    "lmdbm>=0.0.6",
    "mcp>=1.27.1",
    "platformdirs>=4.9.6",
    "pytest>=9.0.3",
    "tiktoken>=0.13.0",
]
