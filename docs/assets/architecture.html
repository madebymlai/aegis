<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aegis architecture</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  .diagram { width: 1180px; height: 640px; }
  svg { display: block; }
  text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pkg  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
  .role { font-weight: 400; }
  .lbl  { font-style: italic; }
  .chip { font-weight: 600; }
  .stage{ font-weight: 700; letter-spacing: .14em; }
</style>
</head>
<body>
<div class="diagram">
<svg viewBox="0 0 1180 640" width="1180" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>

  <!-- title -->
  <text x="590" y="30" text-anchor="middle" class="stage" font-size="12" fill="#94A3B8">AEGIS ARCHITECTURE</text>
  <text x="590" y="54" text-anchor="middle" font-size="17" fill="#475569">One pipeline, from research hypothesis to live execution</text>

  <!-- ===== arrows (drawn first, under cards) ===== -->
  <!-- data -> rd -->
  <path d="M296 214 C 360 214 378 150 428 142" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" class="lbl" font-size="12.5" fill="#64748B">bars</text>
  <!-- data -> trader -->
  <path d="M296 300 C 360 300 378 424 428 432" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="384" text-anchor="middle" class="lbl" font-size="12.5" fill="#64748B">bars</text>
  <!-- rd -> bundle -->
  <path d="M590 224 L 590 258" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="247" class="lbl" font-size="12.5" fill="#64748B">aerd export</text>
  <!-- bundle -> trader -->
  <path d="M590 316 L 590 356" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="341" class="lbl" font-size="12.5" fill="#64748B">install</text>
  <!-- trader -> venues -->
  <path d="M750 438 L 880 446" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="430" class="lbl" font-size="12.5" fill="#64748B">orders</text>
  <!-- support ticks onto runtime -->
  <path d="M520 556 l 7 -11 l 7 11 Z" fill="#CBD5E1"/>
  <path d="M654 556 l 7 -11 l 7 11 Z" fill="#CBD5E1"/>

  <!-- ===== aegis-data ===== -->
  <g filter="url(#shadow)">
    <rect x="44" y="150" width="252" height="214" rx="18" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5"/>
  </g>
  <text x="64" y="188" class="pkg" font-size="19" fill="#0E7490">aegis-data</text>
  <text x="64" y="212" class="role" font-size="14" fill="#475569">Market-data corpus</text>
  <g font-size="12.5" class="chip">
    <rect x="64" y="238" width="196" height="27" rx="13" fill="#CFFAFE"/>
    <text x="76" y="256" fill="#0E7490">Nautilus catalog</text>
    <rect x="64" y="274" width="196" height="27" rx="13" fill="#CFFAFE"/>
    <text x="76" y="292" fill="#0E7490">InstrumentId keyed</text>
    <rect x="64" y="310" width="196" height="27" rx="13" fill="#CFFAFE"/>
    <text x="76" y="328" fill="#0E7490">roll-adjusted futures</text>
  </g>

  <!-- ===== aegis-rd ===== -->
  <g filter="url(#shadow)">
    <rect x="430" y="72" width="320" height="152" rx="18" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  </g>
  <text x="452" y="112" class="pkg" font-size="19" fill="#4338CA">aegis-rd</text>
  <text x="452" y="136" class="role" font-size="14" fill="#475569">Research operating system</text>
  <g font-size="12.5" class="chip">
    <rect x="452" y="164" width="276" height="27" rx="13" fill="#E0E7FF"/>
    <text x="464" y="182" fill="#4338CA">optimize · score · validate</text>
  </g>
  <text x="452" y="212" class="lbl" font-size="12.5" fill="#6366F1">promotes a scored Candidate as a Lock</text>

  <!-- ===== Execution Bundle ===== -->
  <g filter="url(#shadow)">
    <rect x="490" y="258" width="200" height="58" rx="29" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  </g>
  <text x="590" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#6D28D9">Execution Bundle</text>
  <text x="590" y="302" text-anchor="middle" font-size="11.5" fill="#8B7EC8">baked wheel · locked params</text>

  <!-- ===== aegis-trader ===== -->
  <g filter="url(#shadow)">
    <rect x="430" y="360" width="320" height="152" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  </g>
  <text x="452" y="400" class="pkg" font-size="19" fill="#047857">aegis-trader</text>
  <text x="452" y="424" class="role" font-size="14" fill="#475569">Live + backtest execution</text>
  <g font-size="12.5" class="chip">
    <rect x="452" y="450" width="276" height="27" rx="13" fill="#D1FAE5"/>
    <text x="464" y="468" fill="#047857">commingled book · sleeves · roll</text>
  </g>

  <!-- ===== venues ===== -->
  <g filter="url(#shadow)">
    <rect x="884" y="384" width="208" height="122" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <text x="904" y="420" font-size="15" font-weight="700" fill="#334155">Interactive Brokers</text>
  <text x="904" y="443" class="role" font-size="13" fill="#475569">paper / live venue</text>
  <text x="904" y="463" class="lbl" font-size="12" fill="#64748B">the gateway port decides</text>
  <g font-size="12" class="chip">
    <rect x="904" y="474" width="168" height="24" rx="12" fill="#E2E8F0"/>
    <text x="915" y="491" fill="#334155">or the backtest engine</text>
  </g>

  <!-- ===== aegis-runtime (foundation) ===== -->
  <g filter="url(#shadow)">
    <rect x="44" y="556" width="1048" height="66" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="72" y="585" class="pkg" font-size="17" fill="#334155">aegis-runtime</text>
  <text x="72" y="606" class="role" font-size="12.5" fill="#64748B">shared execution kernel · both stages run one Locked Candidate here</text>
  <g font-size="12" class="chip">
    <rect x="596" y="576" width="150" height="26" rx="13" fill="#E2E8F0"/>
    <text x="608" y="593" fill="#334155">component loading</text>
    <rect x="754" y="576" width="150" height="26" rx="13" fill="#E2E8F0"/>
    <text x="766" y="593" fill="#334155">single-candidate run</text>
    <rect x="912" y="576" width="164" height="26" rx="13" fill="#E2E8F0"/>
    <text x="924" y="593" fill="#334155">Exposure Validation</text>
  </g>
</svg>
</div>
</body>
</html>
