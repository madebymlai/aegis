[project]
name = "aegis-data"
version = "0.1.0"
description = "Shared market-data package: the Catalog, the DataProvider port (IBKR adapter) that fills it, and the roll-transition table for Path-A continuous futures. Used by Aegis RD and Aegis Trader."
requires-python = ">=3.12"
dependencies = [
  "aegis-runtime",
  "numpy",
  "pandas",
  "pyarrow",
  "platformdirs",
  "nautilus-trader>=1.229.0",
  "nautilus-ibapi==10.45.1",
  "protobuf>=5.29.6",
]

[project.scripts]
aegis-data = "aegis_data.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis_data*"]

[tool.uv.sources]
aegis-runtime = { path = "../aegis-runtime", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["aegis_data", "tests"]
exclude = ["^scripts/"]

[[tool.mypy.overrides]]
module = [
  "ibapi",
  "ibapi.*",
  "nautilus_trader.*",
  "pandas",
  "pandas.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "pytest>=9.1.0",
]
