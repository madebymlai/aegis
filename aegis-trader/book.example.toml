# Aegis commingled-book spec (example).
#
# This is the operator-facing, version-controllable declaration of WHAT to run.
# It is *not* where secrets go: the IBKR connection and account come from the
# environment, never this file.
#
#   Run:   aegis-trader --mode {backtest,paper,live} --book book.toml
#          (--book is optional: if omitted, book.toml is discovered by walking
#           up from the current directory)
#
#   Paper/live also read the broker connection from the environment:
#     IB_ACCOUNT_ID   (required; e.g. DU1234567 paper, U7654321 live)
#     IB_HOST         (default 127.0.0.1)
#     IB_PORT         (default 7497 paper / 7496 live; IB Gateway: 4002 / 4001)
#     IB_CLIENT_ID    (default 1)
#     TRADER_ID       (default TRADER-001)

# Base currency of the book — NAV, cash, and FX sizing are expressed in it.
base_currency = "EUR"

# Annualized book volatility target for risk-budget scaling.
book_vol_target = 0.09

# On a sleeve-weight band breach, move this fraction toward the newly solved
# risk-budget weight rather than fully resetting the sleeve.
sleeve_reversion_fraction = 0.5

# Optional book-level drawdown de-lever: exposure stays at 1.0 until the
# running NAV drawdown reaches start_drawdown, then linearly scales to
# floor_multiplier at end_drawdown. It never increases exposure.
[drawdown_delever]
start_drawdown = 0.05
end_drawdown = 0.25
floor_multiplier = 0.50

# Gross cap after risk-budget scaling; raise it to run levered across sleeves.
max_book_gross = 1.0

# Risk caps, all as fractions of NAV. Provenance (caps <= what research
# validated) is checked at load against each sleeve's bundle, not declared here.
gross_cap = 1.0       # max sum |w_i|
net_cap = 0.5         # max |sum w_i|
per_name_cap = 0.1    # max |w_i| per instrument

# Symmetric default drift bands (no-trade region around target weights).
default_band_up = 0.02
default_band_down = 0.02

# Book-level aggregate fidelity: max sum |w_realized - w_target| before tripping.
aggregate_drift_threshold = 0.5

# Optional simulated-run transaction costs. Backtest and paper/SANDBOX inject
# these into Nautilus fee/fill models; live takes broker-reported costs instead.
# Omit this block for today's zero-cost simulation behavior.
# [costs]
# per_share_commission = 0.0035      # commission per share in quote currency
# min_commission_per_order = 1.0     # per-fill/order floor
# max_commission_pct = 0.01          # cap as fraction of trade notional
# slippage_probability = 0.25        # probability of one-tick adverse slippage
# slippage_seed = 42                 # pinned RNG seed for deterministic fills
#
# [costs.borrow]
# rate = 0.015                       # annual general-collateral borrow fee on shorts
#
# [costs.margin_interest]
# EUR = 0.04                         # annual rate charged on EUR debit balances
# GBP = 0.06                         # annual rate charged on GBP debit balances
# USD = 0.055                        # annual rate charged on USD debit balances

# Sleeves — each a risk-budgeted sub-portfolio backed by one content-addressed
# bundle wheel. Instruments carry their own venue (resolved per FIGI); the book
# never names a single venue.
[[sleeves]]
name = "trend_lse"
wheel_filename = "trend_lse-abc123.whl"
risk_share = 0.6
group = "Floor"
weight_band_down = 0.02
weight_band_up = 0.02

[[sleeves]]
name = "tail_xetra"
wheel_filename = "tail_xetra-def456.whl"
risk_share = 0.0  # Target risk is set by tail_convexity_budget below.
group = "Target"
weight_band_down = 0.02
weight_band_up = 0.02

[[sleeves]]
name = "market_neutral"
wheel_filename = "market_neutral-ghi789.whl"
risk_share = 0.0  # Expansion defaults to zero until it earns a budget.
group = "Expansion"

[tail_convexity_budget]
# Coverage is book NAV delivered at the attachment (stress) move; candidates are
# filled highest-efficiency-first to coverage_target, capped per-candidate by
# capacity and collectively by the annual carry (premium) budget.
attachment = -0.20            # the stress move protection is defined against
coverage_target = 0.01        # deliver >= 1% of book NAV at the attachment
annual_carry_budget = 0.0075  # optional premium ceiling: <= 0.75% of NAV/yr

[[tail_convexity_budget.candidates]]
# Per unit of the sleeve's risk share: NAV at the attachment, and NAV/yr carry.
sleeve = "tail_xetra"
payoff_at_attachment = 0.20
annual_carry = 0.08
crisis_reliability = 0.75
capacity_risk_share = 0.05

# Per-FIGI asymmetric band overrides (optional).
[[band_overrides]]
figi = "BBG000B9XRY4"
band_up = 0.05
band_down = 0.02
