# Aegis commingled-book spec.
#
# Three research-validated sleeves, each pinned to a content-addressed execution
# bundle wheel exported from aegis-rd (aerd export) and installed into this
# runtime.  Base currency is EUR; each instrument carries its own venue (the
# book is venue-agnostic).
#
#   Run:   aegis-trader --mode {backtest,paper,live} --book book.toml
#          (paper/live also read IB_ACCOUNT_ID / IB_HOST / IB_PORT /
#           IB_CLIENT_ID / TRADER_ID from the environment)

base_currency = "EUR"
book_vol_target = 0.09
sleeve_reversion_fraction = 0.5

# Gross cap after risk-budget scaling; raise max_book_gross to run levered.
max_book_gross = 1.0

# Book caps as fractions of NAV.  Provenance is checked at load against each
# sleeve's bundle (all three carry gross_cap = net_cap = 1.0), so these must not
# exceed those ceilings.
gross_cap = 1.0
net_cap = 1.0

# Floor risk keeps a fixed 60/40 trend/carry conviction tilt.
# atalanta — trend floor pole (20-name orthogonal non-equity LSE universe).
[[sleeves]]
name = "atalanta_trend"
wheel_filename = "aegis_exec_atalanta_trendstraddlebuffered_cand_b98-1.0.0-py3-none-any.whl"
risk_share = 0.42
group = "Floor"
weight_band_down = 0.02
weight_band_up = 0.02

# demeter — EU credit-carry pole (IHYU + LQDH, USD legs converted to EUR).
[[sleeves]]
name = "demeter_carry"
wheel_filename = "aegis_exec_demeter_carry_cand_c94-1.0.0-py3-none-any.whl"
risk_share = 0.28
group = "Floor"
weight_band_down = 0.02
weight_band_up = 0.02

# aegis — UCITS tail hedge (VOOL, native EUR, held 100% within the sleeve).
[[sleeves]]
name = "aegis_tail"
wheel_filename = "aegis_exec_aegis_heldhedge_cand_fa6-1.0.0-py3-none-any.whl"
risk_share = 0.15
group = "Target"
weight_band_down = 0.02
weight_band_up = 0.02
