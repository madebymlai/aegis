[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-trader"
version = "0.1.0"
description = "Live execution context for Aegis: runs the commingled book of Execution Bundles as a NautilusTrader overlay."
requires-python = ">=3.12"
# Per ADR-0001 (Trader is a NautilusTrader commingling overlay): aegis-runtime is the
# shared locked-execution kernel, nautilus_trader owns the venue/OMS/event loop, pydantic
# types the Book Config. VBT PRO is only a *transitive* dep, arriving with an installed
# Execution Bundle wheel — never declared here.
dependencies = [
  "aegis-runtime",
  "aegis-data",
  "nautilus_trader",
  "pydantic>=2.0",
  "aegis-exec-aegis-heldhedge-cand-b60",
  "aegis-exec-atalanta-keystone-shortmute-cand-06c",
  "aegis-exec-demeter-carry-mix-cand-ff2",
  "requests>=2.34.2",
]

# IBKR adapter (ibapi) — required only for paper/live runs and the IBKR
# verification script (scripts/verify_paper_ibkr.py); backtests don't need it.
[project.optional-dependencies]
ib = ["nautilus_trader[ib,docker]"]

[project.scripts]
# Operator entrypoint: `aegis-trader backtest --start --end` (offline) and
# `aegis-trader trader start|stop` (live; paper vs live = IB_PORT). The book spec
# is declarative (book.toml); the IBKR connection + account come from the
# environment (IB_* / TRADER_ID), never the committed spec.
aegis-trader = "aegis_trader.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_trader*"]

[tool.mypy]
python_version = "3.12"
files = ["aegis_trader", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

# nautilus_trader ships no type stubs, pandas' stubs aren't installed, and
# aegis-runtime is resolved as an editable local wheel — none expose types to
# mypy.  Suppress the missing-import noise without weakening checks on our own code.
[[tool.mypy.overrides]]
module = [
    "nautilus_trader.*",
    "pandas",
    "pandas.*",
    "aegis_runtime",
    "aegis_runtime.*",
    "aegis_data",
    "aegis_data.*",
]
ignore_missing_imports = true

[tool.uv.sources]
aegis-runtime = { path = "../aegis-runtime", editable = true }
aegis-data = { path = "../aegis-data", editable = true }
aegis-exec-aegis-heldhedge-cand-b60 = { path = "../bundles/aegis_exec_aegis_heldhedge_cand_b60-1.0.0-py3-none-any.whl" }
aegis-exec-atalanta-keystone-shortmute-cand-06c = { path = "../bundles/aegis_exec_atalanta_keystone_shortmute_cand_06c-1.0.0-py3-none-any.whl" }
aegis-exec-demeter-carry-mix-cand-ff2 = { path = "../bundles/aegis_exec_demeter_carry_mix_cand_ff2-1.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    # tests/e2e/conftest.py marks each engine test `forked` so Nautilus's
    # process-global Rust runtime (logger/clock) can't poison later tests;
    # the marker is a silent no-op without this plugin (second engine aborts).
    "pytest-forked>=1.6.0",
]
