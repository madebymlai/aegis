[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-trader"
version = "0.1.0"
description = "Live execution context for Aegis: runs the commingled book of Execution Bundles as a NautilusTrader overlay."
requires-python = ">=3.12"
# Per ADR-0001 (Trader is a NautilusTrader commingling overlay): aegis-runtime is the
# shared locked-execution kernel, nautilus_trader owns the venue/OMS/event loop, pydantic
# types the Book Config. VBT PRO is only a *transitive* dep, arriving with an installed
# Execution Bundle wheel — never declared here.
#
# The Execution Bundles themselves are not declared here either. The book names its
# sleeves' packages and they are resolved by import at run time, so which bundles a
# deployment carries is a property of that environment, not of this package. Pinning
# named candidate wheels would make the Trader installable only where those exact
# research artefacts exist. Install them alongside it instead: uv pip install ../bundles/*.whl
dependencies = [
  "aegis-runtime",
  "aegis-data",
  "nautilus_trader>=1.231.0",
  "pydantic>=2.0",
  "requests>=2.34.2",
]

# IBKR adapter (ibapi) — required only for paper/live runs and the IBKR
# verification script (scripts/verify_paper_ibkr.py); backtests don't need it.
[project.optional-dependencies]
ib = ["nautilus_trader[ib,docker]>=1.231.0"]

[project.scripts]
# Operator entrypoint: `aegis-trader backtest --start --end` (offline) and
# `aegis-trader trader start|stop` (live; paper vs live = IB_PORT). The book spec
# is declarative (book.toml); the IBKR connection + account come from the
# environment (IB_* / TRADER_ID), never the committed spec.
aegis-trader = "aegis_trader.cli:main"

[tool.setuptools.packages.find]
include = ["aegis_trader*"]

[tool.mypy]
python_version = "3.12"
files = ["aegis_trader", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]

# nautilus_trader ships no type stubs, pandas' stubs aren't installed, and
# aegis-runtime is resolved as an editable local wheel — none expose types to
# mypy.  Suppress the missing-import noise without weakening checks on our own code.
[[tool.mypy.overrides]]
module = [
    "nautilus_trader.*",
    "pandas",
    "pandas.*",
    "aegis_runtime",
    "aegis_runtime.*",
    "aegis_data",
    "aegis_data.*",
]
ignore_missing_imports = true

[tool.uv.sources]
aegis-runtime = { path = "../aegis-runtime", editable = true }
aegis-data = { path = "../aegis-data", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    # Nautilus engine tests require a fresh interpreter because its Rust runtime
    # holds process-global logger/clock state.
    "pytest-isolated>=0.5.0",
]
