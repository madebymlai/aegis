[project]
name = "aegis-rd"
version = "0.1.0"
description = "VectorBT PRO-first research loop for labeling, training, signal experiments, and backtesting."
requires-python = ">=3.12"
dependencies = [
  "joblib",
  "numpy",
  "pandas",
  "pyyaml",
  "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
