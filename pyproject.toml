[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-rd"
version = "0.1.0"
description = "VectorBT PRO-first research loop for labeling, training, signal experiments, and backtesting."
requires-python = ">=3.12"
dependencies = [
  "dill",
  "joblib",
  "numpy",
  "nbclient>=0.10.2",
  "nbformat>=5.10.4",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "tomlkit",
  "vectorbtpro",
  "yfinance>=0.2.56",
]

[project.scripts]
aerd = "research.aegis_research.cli:main"

[tool.setuptools.packages.find]
include = ["research*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
vectorbtpro = { git = "https://github.com/polakowo/vectorbt.pro.git", branch = "develop" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes: undefined names, unused imports
  "I",    # import sorting
  "UP",   # modern Python syntax
  "B",    # likely bugs and unsafe patterns
  "C4",   # cleaner comprehensions
  "SIM",  # simpler control flow
  "RET",  # clearer returns
  "TRY",  # exception-handling hygiene
  "PERF", # obvious performance footguns
  "PTH",  # pathlib consistency
  "PIE",  # miscellaneous cleanup rules
  "RUF",  # Ruff-specific rules
]
ignore = [
  "E501",   # let the formatter handle wrapping; long literals/messages can stay readable
  "PERF401", # explicit loops are often clearer for accumulating validation issues
  "TRY003", # keep concise domain errors without forcing custom exception classes everywhere
]

[dependency-groups]
dev = [
    "bm25s>=0.3.9",
    "ipykernel>=7.2.0",
    "lmdbm>=0.0.6",
    "mcp>=1.27.1",
    "platformdirs>=4.9.6",
    "pytest>=9.0.3",
    "tiktoken>=0.13.0",
]
