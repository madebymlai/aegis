schema_version: 1
name: synthetic_trendlb_baseline
output_dir: runs

data:
  source: synthetic
  symbols: [SYN]
  start: "2020-01-01"
  timeframe: "1D"
  rows: 900
  seed: 42

indicators:
  returns: [1, 5, 20]
  moving_average_windows: [10, 30]
  volatility_windows: [20]
  rsi_windows: [14]

labels:
  kind: trendlb
  up_th: 0.08
  down_th: 0.08
  mode: binary
  positive_value: 1

split:
  kind: rolling
  train_size: 0.7
  embargo_bars: 5
  n: 5
  length: optimize

model:
  kind: logistic_regression
  min_train_samples: 100

signals:
  long_threshold: 0.55
  exit_threshold: 0.50

portfolio:
  init_cash: 10000.0
  fees: 0.001
  slippage: 0.0005
  size: 1.0
  size_type: valuepercent
  direction: longonly

report:
  freq: 1D
  year_freq: 252D
  min_oos_sharpe: 0.5
  max_oos_drawdown: 0.35
  min_oos_trades: 5
