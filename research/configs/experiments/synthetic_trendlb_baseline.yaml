schema_version: 1
name: synthetic_trendlb_baseline
output_dir: runs

data:
  source: synthetic
  symbols: [SYN]
  start: "2020-01-01"
  timeframe: "1D"
  rows: 900
  seed: 42

indicators:
  invalid_value_policy: drop_rows
  specs:
    - id: returns
      params:
        window: [1, 5, 20]
      outputs: [returns]
      model_features:
        - output: returns
    - id: ma
      params:
        window: [10, 30]
        wtype: simple
      outputs: [ma]
      model_features:
        - output: ma
          transform: distance_to_close
    - id: volatility
      params:
        window: [20]
      outputs: [volatility]
      model_features:
        - output: volatility
    - id: rsi
      params:
        window: [14]
        wtype: wilder
      outputs: [rsi]
      model_features:
        - output: rsi
          transform: scale_0_1

labels:
  generator:
    kind: trendlb
    params:
      up_th: 0.08
      down_th: 0.08
      mode: binary
  target:
    role: supervised_target
    source_output: labels
    select:
      params:
        up_th: 0.08
        down_th: 0.08
        mode: binary
    transform:
      name: identity_binary
      version: 1
      params:
        positive_value: 1

split:
  kind: rolling
  train_size: 0.7
  embargo_bars: 5
  n: 5
  length: optimize

model:
  kind: logistic_regression
  min_train_samples: 100

signals:
  long_threshold: 0.55
  exit_threshold: 0.50

portfolio:
  init_cash: 10000.0
  fees: 0.001
  slippage: 0.0005
  size: 1.0
  size_type: valuepercent
  direction: longonly

report:
  freq: 1D
  year_freq: 252D
  min_oos_sharpe: 0.5
  max_oos_drawdown: 0.35
  min_oos_trades: 5
