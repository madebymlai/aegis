schema_version: 2
name: synthetic_purged_fixlb_baseline
output_dir: runs

data:
  source: synthetic
  symbols: [SYN]
  start: "2020-01-01"
  timeframe: "1D"
  rows: 360
  seed: 42

indicators:
  invalid_value_policy: drop_rows
  specs:
    - id: returns
      params:
        window: [1, 5, 20]
      outputs: [returns]
      model_features:
        - output: returns
    - id: ma
      params:
        window: [10, 30]
        wtype: simple
      outputs: [ma]
      model_features:
        - output: ma
          transform: distance_to_close
    - id: volatility
      params:
        window: [20]
      outputs: [volatility]
      model_features:
        - output: volatility
    - id: rsi
      params:
        window: [14]
        wtype: wilder
      outputs: [rsi]
      model_features:
        - output: rsi
          transform: scale_0_1

labels:
  generator:
    kind: fixlb
    params:
      n: 5
  target:
    role: supervised_target
    source_output: labels
    select:
      params:
        n: 5
    transform:
      name: threshold_future_return
      version: 1
      params:
        threshold: 0.0

split:
  kind: purged_kfold
  n_folds: 5
  n_test_folds: 1
  purge_td: 0D
  embargo_td: 0D
  max_splits: 5
  max_estimated_output_cells: 500000
  max_public_artifact_bytes: 5000000

model:
  kind: logistic_regression
  min_train_samples: 50

signals:
  long_threshold: 0.55
  exit_threshold: 0.50

portfolio:
  init_cash: 10000.0
  fees: 0.001
  slippage: 0.0005
  size: 1.0
  size_type: valuepercent
  direction: longonly

report:
  freq: 1D
  year_freq: 252D
  min_oos_sharpe: 0.5
  max_oos_drawdown: 0.35
  min_oos_trades: 5
