[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
version = "0.4.0"
description = "Shared locked-execution runtime for Aegis: runs an Execution Bundle's strategy + indicators against supplied market data and gates the result."
requires-python = ">=3.12"
dependencies = [
  "nautilus_trader>=1.231.0",
  "msgspec>=0.21.1",
  "numba>=0.66.0",
  "numpy",
  "pandas",
]

[tool.setuptools.packages.find]
include = ["aegis_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["aegis_runtime", "tests"]

# nautilus_trader ships no type stubs and pandas' stubs aren't installed, so
# neither exposes types to mypy.  Suppress the missing-import noise without
# weakening checks on our own code.
[[tool.mypy.overrides]]
module = [
    "nautilus_trader.*",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.0",
]
