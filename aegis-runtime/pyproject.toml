[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
version = "0.1.0"
description = "Shared locked-execution runtime for Aegis: runs an Execution Bundle's strategy + indicators against supplied market data and gates the result."
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
]

[tool.setuptools.packages.find]
include = ["aegis_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
