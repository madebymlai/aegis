schema_version: 4
lane: train
name: synthetic_purged_fixlb_scaffold_fixture
output_dir: runs

data:
  source: synthetic
  arrays: [OHLCV]
  symbols: [SYN]
  start: "2020-01-01"
  timeframe: "1D"
  rows: 360
  seed: 42

indicators:
  - source: component
    ids: [demo.native_indicators]

train:
  label:
    source: component
    id: demo.fixlb
  model:
    source: plugin
    id: aegis.sklearn_logistic
    min_train_samples: 50
    params:
      max_iter: 1000
      random_state: 42
  split:
    kind: purged_kfold
    n_folds: 5
    n_test_folds: 1
    purge_td: 0D
    embargo_td: 0D
    max_splits: 5
    max_estimated_output_cells: 500000
    max_public_artifact_bytes: 5000000
  signals:
    policy: long_only_hysteresis
    long_entry_threshold: 0.55
    long_exit_threshold: 0.50
    execution_timing: next_open

portfolio:
  init_cash: 10000.0
  fees: 0.001
  slippage: 0.0005
  entry_budget: 1.0
  direction: longonly

report:
  freq: 1D
  year_freq: 252D
  min_oos_sharpe: 0.5
  max_oos_drawdown: 0.35
  min_oos_trades: 5
